   note:{c:"good",h:"State it crisply",b:"Forward RNN + backward RNN over the same input; per-position hidden state \\(h_t=[\\overrightarrow{h_t}\\,;\\,\\overleftarrow{h_t}]\\) (concatenation). Gives each output access to both left and right context. Requires the full sequence up front → no streaming / no generation."},
   body:"A forward RNN computes \\(\\overrightarrow{h_t}\\) from \\(x_1{\\dots}x_t\\); a separate backward RNN computes \\(\\overleftarrow{h_t}\\) from \\(x_T{\\dots}x_t\\). The combined state at position t is the concatenation \\(h_t=[\\overrightarrow{h_t};\\overleftarrow{h_t}]\\) (fed to the output layer). So the representation at every position depends on the <i>entire</i> sequence, not just the prefix.<br><br>"+

/* ---- t5-ae — Bank B — Autoencoder: architecture + purpose ---- */
RM.blocks.push({
 id:"t5-ae", tier:5, code:"T5", bank:"B",
 title:"Autoencoder: architecture + purpose",
 exams:"SS21 Q11 · SoSe25 Q8a",
 points:"5p (SS21: 2 sketch + 3 justify) · 4p (SoSe25, latent z dim 10)",
 primer:{
  test:"Whether you can sketch the encoder→bottleneck→decoder architecture and state, in one or two lines, what an autoencoder is for and how the design achieves it — compress input to a low-dimensional latent code, then reconstruct, learning by minimising reconstruction error.",
  idea:"An <b>autoencoder</b> is a neural network trained to copy its input to its output through a deliberate <b>bottleneck</b>. It has two halves: an <b>encoder</b> that maps the input x down to a low-dimensional <b>latent code</b> z (in SoSe25, dim 10), and a <b>decoder</b> that maps z back up to a reconstruction x̂ of the original. Training is unsupervised — no labels — and the loss is the <b>reconstruction error</b>, typically ‖x − x̂‖² (or cross-entropy for binary inputs); the network's parameters are adjusted so its output matches its input as closely as possible.<br><br>The purpose follows from the bottleneck. Because z has far fewer dimensions than x, the network cannot simply pass the input through; it is forced to discard redundancy and keep only the most informative structure — so z becomes a compressed, learned <b>representation</b> of the data. That makes autoencoders useful for unsupervised representation learning, non-linear dimensionality reduction (a more powerful cousin of PCA), denoising, and pretraining. The mechanism — \"how is it achieved\" — is exactly this: force the data through a narrow latent layer and minimise reconstruction loss, so the only way to reconstruct well is to have learned an efficient encoding of the input. The sketch the exam wants is x → encoder → z (narrow) → decoder → x̂, with the loss comparing x̂ to x."
 },
 lede:"<b>Encoder → bottleneck z → decoder → reconstruction.</b> The encoder compresses input x to a low-dimensional latent code z (SoSe25: dim 10); the decoder reconstructs x̂ from z. Trained unsupervised to minimise reconstruction loss \\(\\lVert x-\\hat x\\rVert^2\\). <b>Purpose:</b> unsupervised representation learning / dimensionality reduction. <b>How achieved:</b> the narrow z forces the net to discard redundancy and keep only informative structure, so reconstructing well requires an efficient encoding.",
 why:"SS21 Q11 = sketch (2p) + justify purpose & mechanism (3p); SoSe25 Q8a = same, 4p, with latent z of dim 10 called out. Marks: correct three-part diagram, name the purpose (representation learning / dim-reduction), and the mechanism (bottleneck + reconstruction loss).",
 sections:[

   note:{c:"good",h:"Exam-write (node/edge form)",b:"node(x, input n-dim) → node(enc, encoder) → node(z, latent 10-dim) → node(dec, decoder) → node(xh, reconstruction n-dim); loss compares xh to x. Draw z visibly narrower than x and x̂."},
   body:"<b>Architecture.</b> \\(x\\;\\xrightarrow{\\text{encoder }f}\\;z\\;\\xrightarrow{\\text{decoder }g}\\;\\hat x\\), with \\(\\dim(z)\\ll\\dim(x)\\) (SoSe25: \\(n\\to10\\to n\\)). Encoder and decoder are (usually symmetric) neural nets; z is the bottleneck / code layer.<br><br>"+
   "<b>Objective.</b> Unsupervised — minimise reconstruction loss \\(\\mathcal L=\\lVert x-\\hat x\\rVert^2\\) (MSE), or cross-entropy for binary inputs. No labels are used.<br><br>"+
   "<b>Purpose (what it's for).</b> Learn a compact, informative representation of the data: unsupervised representation learning and non-linear dimensionality reduction (generalises PCA), also denoising and pretraining.<br><br>"+

  idea:"The explicit-vs-implicit distinction is about whether a generative model gives you an actual probability density for the data. An <b>explicit</b> probabilistic model defines a parametric likelihood p(x) (or a tractable bound on it) and is trained by optimising that likelihood; you can, at least approximately, evaluate how probable a data point is. An <b>implicit</b> model never writes down a density — it only specifies a procedure for drawing samples, and is trained so those samples match the data distribution, without ever computing p(x).<br><br>A <b>VAE is explicit.</b> It assumes a prior p(z) over latent variables (typically standard Gaussian) and a decoder p(x|z), which together define an explicit generative density p(x) = ∫ p(x|z)p(z) dz. Because that integral is intractable, the VAE introduces an approximate posterior q(z|x) and maximises the <b>ELBO</b>, a tractable lower bound on log p(x): ELBO = 𝔼_{q(z|x)}[log p(x|z)] − KL(q(z|x) ‖ p(z)) — a reconstruction term minus a term pulling the latent distribution toward the prior. So a VAE explicitly optimises (a bound on) a likelihood. A <b>GAN is implicit</b>: its generator defines only how to turn noise into samples, trained by an adversarial game against a discriminator; it never defines or evaluates p(x). That contrast — VAE optimises an explicit likelihood via the ELBO, GAN only learns to sample — is exactly the justification the exam asks for."

 primer:{
  test:"Whether you can explain why sampling blocks backpropagation in a VAE and how the reparameterization trick fixes it, and then state the resulting reparametrized form. The 3 marks for the form are for writing z = μ + σ⊙ε with ε ~ N(0, I).",
  idea:"Training a VAE needs gradients of the loss with respect to the encoder parameters, which produce the mean μ and standard deviation σ of the latent distribution. But the latent code is <b>sampled</b>: z ~ N(μ, σ²). A sampling operation is stochastic and not a differentiable function of μ and σ — there is no well-defined derivative of \"draw a random number\" with respect to the parameters of the distribution you drew from — so gradients cannot flow back through the sampling node to the encoder, and ordinary backpropagation stalls.<br><br>The <b>reparameterization trick</b> removes the randomness from the path that needs gradients. Instead of sampling z directly, you sample a parameter-free noise variable ε ~ N(0, I) from a fixed standard normal, and then compute z deterministically as z = μ + σ⊙ε (⊙ is element-wise multiplication). This is an exact re-expression: μ + σ⊙ε with ε ~ N(0,1) has the same distribution N(μ, σ²) as before. The crucial change is structural: the only stochastic node is now ε, which carries no learnable parameters and needs no gradient, while μ and σ enter z through the plain differentiable operations of addition and multiplication. So the gradient can flow through z back into μ, σ and hence into the encoder, and the whole VAE becomes trainable end-to-end by backpropagation. The resulting reparametrized form the exam asks you to state is exactly z = μ + σ⊙ε, ε ~ N(0, I)."

  idea:"A single neuron computes a linear pre-activation z = w₁x₁ + w₂x₂ + w₃x₃ + b and then passes it through the logistic sigmoid f(z) = 1/(1+e⁻ᶻ). Training needs the derivative of the output with respect to each parameter, obtained by the chain rule df/dwᵢ = (df/dz)·(dz/dwᵢ). The two pieces are easy: the sigmoid's own derivative has the compact closed form f'(z) = f(z)(1 − f(z)) — worth memorising because you never have to re-derive it — and the linear pre-activation contributes dz/dwᵢ = xᵢ (only the i-th term survives, the rest are constants in wᵢ) and dz/db = 1. Multiplying gives df/dwᵢ = f(z)(1 − f(z))·xᵢ and df/db = f(z)(1 − f(z)).<br><br>The second part adds L2 regularisation, α∑wᵢ², to the objective. Because differentiation is linear, you just differentiate the two summands separately (the sum rule) and add: the sigmoid term is unchanged, and the penalty contributes d/dwᵢ(α∑wⱼ²) = 2αwᵢ (every other weight is a constant with respect to wᵢ, so its derivative is 0). Hence with L2, df/dwᵢ = f(z)(1 − f(z))·xᵢ + 2αwᵢ. The bias is normally not regularised, so df/db is unchanged. The whole question is 2 marks per part, and the marks are for showing the chain-rule split explicitly and writing the sigmoid derivative in the σ(1−σ) form — not for any numerical arithmetic, since no numbers are given."

  idea:"Gradient descent updates weights by θ ← θ − η∇L, where η is the learning rate — the step size. Plotting the training loss against iterations reveals the learning rate immediately, because the step size controls how the loss moves. If η is <b>too high</b>, each step overshoots the minimum: the loss bounces around and can even increase or diverge, so the curve is erratic and may trend upward. If η is <b>good</b>, each step makes steady progress and the loss falls quickly and smoothly to a low value, then flattens — the classic healthy training curve. If η is <b>too low</b>, the steps are tiny: the loss still decreases smoothly but far too slowly, so within the iteration budget it is still high, well above the minimum. If η is <b>zero</b>, there is no update at all and the loss is a perfectly flat horizontal line at its initial value.<br><br>The exam draws the axes (iterations on x, loss on y) and asks you to sketch all four curves on them and justify each in one or two sentences. The marks are for the correct qualitative shape and the matching reason — you are not computing anything. The key contrasts to get right: high LR = non-monotonic / diverging (not just \"fast\"), good LR = fast smooth monotonic decrease to a low plateau, low LR = smooth but slow and still high at the end, zero LR = flat. A common trap is drawing the high-LR curve as simply the fastest smooth descent; the point of \"too high\" is that it is unstable and overshoots, so it must show oscillation or divergence rather than a clean fast drop."

  test:"Whether you can read a train/validation-loss plot as overfitting, say the model won't generalise, define early stopping and mark the right epoch, and name a couple of alternative fixes. It tests the diagnostic reading of the two curves diverging and the standard remedies.",
  idea:"When training loss keeps falling but validation loss stops falling and starts to rise, the model is fitting the training data ever better while getting worse on unseen data — this gap is <b>overfitting</b>, and it means the model will <i>not</i> generalise well. The validation curve is the honest estimate of generalisation, so its upturn is the signal to act on, not the still-decreasing training curve.<br><br><b>Early stopping</b> is the simplest remedy: monitor the validation loss during training and stop at the epoch where it is at its minimum, before it begins to rise, keeping the model parameters from that point. In a typical plot that is the trough of the validation curve (for the SS21 figure, around epoch 13). It works as an implicit regulariser — it limits how far the weights move from their small initial values, capping effective capacity — and it is essentially free because you are already tracking validation loss. Other standard techniques attack the same overfitting problem by reducing effective capacity or adding noise: L2 weight-decay regularisation (penalise large weights), dropout (randomly zero units so the net can't rely on any one feature), using a smaller/simpler model, and getting more data or augmenting it. The exam wants the diagnosis (overfitting, won't generalise), the definition and epoch for early stopping, and two of these alternatives — briefly, as a checklist."

/* ---- t6-dropout — Bank B — dropout ≈ bagging ---- */
RM.blocks.push({
 id:"t6-dropout", tier:6, code:"T6", bank:"B",
 title:"Dropout ≈ bagging; dropout vs regularization",
 exams:"2024 Q10d-e",
 points:"— (multiple-choice: which ensemble method + the DO↔regularisation relationship)",
 primer:{
  test:"Whether you know that dropout is functionally most like bagging (an ensemble/variance-reduction method), and that a higher dropout rate means stronger regularisation. It probes the mechanism linking dropout to ensembling and to overfitting control.",
  idea:"<b>Dropout</b> is a regularisation technique that, on each training forward pass, randomly sets a fraction of a layer's units to zero (each unit kept with some probability). Because a different random subset is dropped every pass, each update effectively trains a different <b>thinned sub-network</b>, and all these sub-networks share the same underlying weights. At test time no units are dropped and the weights are scaled to account for the change (or, equivalently, inverted-dropout scales during training), so the full network approximates the <i>average</i> of the exponentially many sub-networks that were trained.<br><br>That averaging of many models is exactly the logic of <b>bagging</b> (bootstrap aggregating), which trains many models on resampled data and averages them to reduce variance — so the exam's answer to \"dropout is functionally similar to bagging / boosting / stacking / none\" is <b>bagging</b>. The differences (worth a sentence): in true bagging the models are independent and each trained to convergence on its own bootstrap sample, whereas dropout's sub-networks share parameters and are each updated only briefly — but the variance-reduction-by-averaging intuition is the same, which is why the pairing is bagging and not boosting (which trains models sequentially to fix predecessors' errors) or stacking (which learns a meta-model over base models). The second part asks how dropout relates to regularisation strength: dropping more units (a higher dropout rate) forces the network to rely less on any single feature and lowers effective capacity, so <b>higher dropout ⇒ stronger regularisation</b> — up to a point, since too much dropout underfits."
 },

 why:"2024 Q10 d/e (multiple choice): (d) dropout is functionally similar to Bagging/Boosting/Stacking/None → <b>Bagging</b>; (e) dropout↔regularisation relationship → higher dropout ⇒ higher regularisation. Know the mechanism so you can justify, not just tick.",

   body:"<b>(d) Dropout ≈ bagging.</b> Each training pass drops a random subset of units, so it updates a different sub-network; all share one set of weights. At test time nothing is dropped and weights are scaled, so the network behaves like the average of the exponentially many sub-networks — the same variance-reduction-by-averaging that <b>bagging</b> achieves by training many models on resampled data and averaging. Hence the answer is <b>Bagging</b>. It is not <b>boosting</b> (models trained sequentially, each correcting the last) nor <b>stacking</b> (a meta-model combines base learners). Caveat to mention: dropout's sub-nets share parameters and aren't independently trained to convergence, so it's an <i>approximate</i>, cheap ensemble.<br><br>"+

/* ---- CHEAT SHEET (curated, dense — mirrors the DMML two-side format) ----
   Side 1 = Bank A numerical procedures; Side 2 = Bank B theory.
   PENDING list must shrink to empty as Pass 5/6 blocks are built. */
const CHEAT = {
 side1:[
  {c:"T1", t:"BACKPROP — fill gradients", w:"12–18p · 6/6", b:`<b>grad flows R→L: grad_in × local_deriv → input; SUM at branches.</b> Gate locals: ADD →×1 to each input. MUL z=xy → x gets grad·y, y gets grad·x (the OTHER). MAX/ReLU → full grad to arg-max input, 0 to losers (ReLU=max(0,x): pass if x>0 else 0). σ → σ(1−σ) (use fwd σ). exp → its own output. 1/x → −1/x². −x → −1. +c → ×1. ½(g−y)² → dL/dg=(g−y). <b>Steps:</b> 1 fwd, record every value; 2 grad=1 at out; 3 walk L; 4 SUM at fan-out/skip. <b>Checks:</b> branch/skip = ADD the two grads (most-missed). g<y* ⇒ params ↑.`},
  {c:"T4", t:"BUILD comp-graph act(w·x+b)", w:"8p", b:`Skeleton always: one <code>×</code> per wᵢxᵢ → <code>+</code>-tree to sum → <code>+</code>bias → activation as PRIMITIVE gates. Leaky max(0,αx): ×α then max-0. σ wrapper: −(·)→exp→+1→1/(·). Marks per node/edge. Lose by: activation as black box, or missing bias node. Label every wire.`},
  {c:"T3", t:"CONV — apply / recover kernel", w:"3–5p · 4/6", b:`Out cell = Σ(kernel ⊙ patch), same-position products, slide by stride, <b>no flip</b>. FORWARD: full kernel → fill map. INVERSE: out given + blank kernel cells → each known out-cell = 1 linear eqn in unknowns → solve. (Prof reuses SS21 5×5 input+kernel, hides a row in 2024.)`},

  {c:"T5", t:"SiLU + BN backprop", w:"—", b:`Same T1 walk + 2 locals. SiLU=x·σ(x), deriv=σ(x)+x·σ(x)(1−σ(x)). BN node=γx̂+β, x̂=(x−μ)/√(σ²+ε); given batch stats, local wrt input = <code>γ/√(σ²+ε)</code>.`},
  {c:"T5", t:"MAX-GATE", w:"—", b:`Forward = max. Backward = full grad to arg-max input, 0 to rest (switch, no scaling). Same rule powers max-pool & ReLU.`},
  {c:"T5", t:"LSTM — fill gates", w:"—", b:`f,i,o = σ(·)∈(0,1) gates; g̃=tanh(·)∈(−1,1) candidate. <code>c_t=f⊙c_{t−1}+i⊙g̃</code>; <code>h_t=o⊙tanh(c_t)</code>. Long-range: cell update is ADDITIVE ⇒ grad highway (forget≈1 ⇒ no vanish).`},
  {c:"ACT", t:"Activation derivs (lookup)", w:"7p", b:`σ=1/(1+e⁻ˣ), σ'=σ(1−σ), range (0,1), σ'≤0.25. LeakyReLU: x if x≥0 else αx; f'=1 (x>0)/α (x<0). <b>α=0.04 (2024/SoSe25), ε=0.01 (WiSe25/26) — cite per paper.</b> tanh∈(−1,1), tanh'=1−tanh², range (0,1], max 1 @0.`},
  {c:"T6", t:"SIGMOID NEURON df/dw (+L2)", w:"12p", b:`z=Σwᵢxᵢ+b, f=σ(z). <code>df/dwᵢ = f'(z)·dz/dwᵢ = [1−f(z)]f(z)·xᵢ</code>; <code>df/db=[1−f(z)]f(z)</code>. Add L2=α·Σw² ⇒ <code>+2αwᵢ</code> per weight (sum rule; bias gets NO L2 term). Show the df/dz·dz/dw split + the f(1−f) form — that's the marks.`},
  {c:"T6", t:"LR CURVES (draw)", w:"8p", b:`Loss vs iters: <b>HIGH</b> η = jagged/oscillates/diverges (overshoots — NOT fast-smooth). <b>GOOD</b> = fast smooth drop → low plateau. <b>LOW</b> = smooth but slow, still high at end. <b>ZERO</b> = flat line (no update). 4 shapes + 1 reason each = 8p.`}
 ],
 side2:[
  {c:"T2", t:"RESNET", w:"4–6p · 5/6", b:`Block <code>out=F(x)+x</code>; skip edge adds input back → learns residual. Why: (1) +x add-gate passes grad ×1 → direct route to early layers → deep nets trainable; (2) identity easy (F→0) → depth never hurts. Draw 3-node graph (F, skip, +). Tie every advantage to the skip/gradient path.`},
  {c:"T2", t:"VANISHING vs DYING (+max-pool)", w:"4–6p · 4/6", b:`Vanishing: grads = product of layer locals; if <1 (σ'≤0.25, tanh flat) → shrinks exp with depth → early layers stall (saturation). Dying ReLU: input always <0 → out 0, grad 0 forever → dead; LeakyReLU (α>0) fixes. <b>Max-pool cause vanishing? NO</b> — routes grad ×1 to max, no factor <1.`},
  {c:"T2", t:"GAN", w:"4–6p · 4/6", b:`<b>Diagram</b> (5p): <code>noise z→G→fake</code>; <code>{real (train set), fake (G)}→D→P(real)</code>. Two nets, adversarial minimax: D maximises correct real/fake classification, G minimises it (learns to fool D). <b>Generation</b> (2p): after training discard D, draw a noise vector z, pass it once through the trained <b>generator</b> ⇒ its output is a new synthetic image.`},
  {c:"T3", t:"RNN→TRANSFORMER + O(·)", w:"3–4p · 4/6", b:`2 RNN problems fixed: (1) sequential → no parallelism; (2) long-range deps vanish over many steps. Transformer self-attention: every pos sees every pos in 1 layer → parallel + direct long-range. Per layer: self-attn <code>O(n²·d)</code>, RNN <code>O(n·d²)</code>.`},
  {c:"T3", t:"ETHICS of LLMs", w:"~5p · 4/6", b:`Name 3–4 DISTINCT, 1 line each: bias/toxicity (amplifies data); misinfo/hallucination (fluent-but-false, disinfo); privacy (memorise/leak); env & compute cost + power concentration; misuse/accountability (fraud, unclear responsibility). Breadth > depth; checklist not essay.`},
  {c:"T4", t:"BATCHNORM", w:"4–5p", b:`Def <code>hᵢ=gᵢ·(aᵢ−μᵢ)/σᵢ+bᵢ</code>: standardise over mini-batch (μ,σ), then <b>learned scale g + shift b</b> (don't drop them). Adv+mechanism: stable activation distribution → faster/stable training, higher LR, less init-sensitive, mild regularisation.`},
  {c:"T4", t:"BIAS–VARIANCE (hidden units)", w:"3p", b:`Fewer units → simpler → bias↑ variance↓ (underfit). More → bias↓ variance↑ (overfit). Feature extractor (SoSe25 Q4b): hidden layers learn representation, final layer = simple classifier on it.`},
  {c:"T5", t:"BATCH vs MINIBATCH GD", w:"—", b:`Batch: whole set, exact grad, smooth, slow/costly, memory-heavy, can stall at saddles. Minibatch (SGD=1): random subset, noisy grad, many cheap steps, fits memory, noise escapes saddles/sharp minima → generalises better. Axes: accuracy / cost&freq / memory / convergence.`},
  {c:"T5", t:"OPTIMIZER DIRECTIONS", w:"—", b:`Plain grad = ⟂ contour (steepest descent) → zig-zags on stretched bowl. Newton: <code>Δθ=−H⁻¹∇L</code> uses curvature → ≈straight to min on a quadratic (cost O(d³)). AdaGrad/RMSprop: step = <code>−η·g/√(G+ε)</code>, G = Σg² (AdaGrad) or decayed avg (RMSprop) → per-axis LR; 3:1 grad → ≈45°. RMSprop decay stops AdaGrad's stall.`},
  {c:"T5", t:"GRID vs RANDOM SEARCH", w:"—", b:`Loss depends on only a FEW hyperparams. Grid: points project onto each other → only k distinct values of the important axis (rest redundant). Random: each trial = new value per axis → ≈1 distinct important value per trial → denser coverage, same budget. Edge grows with dimension; grid ok only in 1–2 dims.`},
  {c:"T5", t:"FLAT LOSS → WEIGHT INIT", w:"—", b:`Dead-flat loss = no useful gradient. Suspects: <b>LR too low</b> and/or <b>bad init scale</b> (saturated acts → vanish; all-equal init → symmetry unbroken → all units identical). <b>NOT</b> reg-too-strong (flattens only reg term; data term still moves). Fix: random Xavier/He init + bigger LR.`},
  {c:"T5", t:"BIDIRECTIONAL RNN", w:"—", b:`Two RNNs on same seq: forward + backward; per-position state <code>h_t=[→h_t ; ←h_t]</code> (concat) → each output sees past AND future. Use: NER/POS/speech. <b>Can't</b> stream or generate autoregressively (needs whole sequence).`},
  {c:"T5", t:"AUTOENCODER", w:"5p", b:`<code>x → encoder → z (bottleneck, ≪dim) → decoder → x̂</code>; unsupervised, minimise recon loss <code>‖x−x̂‖²</code>. Purpose: representation learning / dim-reduction. How: narrow z forces discarding redundancy (no bottleneck ⇒ trivial identity). SoSe25: n→10→n.`},
  {c:"T5", t:"VAE explicit vs implicit", w:"5p", b:`VAE = <b>EXPLICIT</b>: prior p(z)+decoder p(x|z) define <code>p(x)=∫p(x|z)p(z)dz</code>; train by maximising <b>ELBO</b> = <code>E_q[log p(x|z)] − KL(q(z|x)‖p(z))</code> (recon − KL). GAN = <b>IMPLICIT</b>: generator only a sampler (noise→img), adversarial, no p(x). Explicit=optimises likelihood; implicit=only samples.`},
  {c:"T5", t:"REPARAM TRICK + ELBO", w:"5p", b:`Can't backprop through <code>z∼N(μ,σ²)</code> (sampling not differentiable in μ,σ). Trick: <code>z = μ + σ⊙ε, ε∼N(0,I)</code> — randomness in ε (no grad), μ,σ via +/× ⇒ ∂z/∂μ=1, ∂z/∂σ=ε → grads reach encoder. ELBO skeleton: <code>E_q[log p(x|z)] − KL(q(z|x)‖p(z))</code>.`},
  {c:"T6", t:"OVERFIT + EARLY STOPPING", w:"6p", b:`Train loss ↓ while val loss ↑ = <b>overfitting</b> → won't generalise. <b>Early stopping</b>: halt at the val-loss minimum (before it rises), keep those weights (implicit regulariser). Alternatives: dropout, L2/weight-decay, simpler model, more data/augmentation.`},
  {c:"T6", t:"DROPOUT ≈ BAGGING", w:"—", b:`Dropout zeroes random units each pass → trains weight-sharing thinned sub-nets; test = full net (scaled) ≈ averaging them → variance reduction = <b>bagging</b> (NOT boosting/stacking). Higher dropout rate ⇒ stronger regularisation (too high ⇒ underfit). Differs from true bagging: shared params, not independent.`}
 ],
 pending:``
};

 {t:6, label:"Tier 6 — Single-neuron / training curves", items:[
  {t:"Sigmoid neuron df/dw", w:"SS21 Q7–8", b:`f=σ(z), z=Σwᵢxᵢ+b. <code>df/dwᵢ=f(1−f)·xᵢ</code>; <code>df/db=f(1−f)</code>. +L2 (α Σw²): <code>df/dwᵢ=f(1−f)xᵢ+2αwᵢ</code>; bias unchanged.`},
  {t:"Early stopping / overfitting", w:"SS21 Q9", b:`<b>Phenomenon</b> (2p): training loss keeps falling while <b>validation loss falls then rises</b> = <b>overfitting</b> ⇒ won't generalise. <b>Early stopping</b> (2p): watch validation loss, stop at its <b>minimum</b> (before it climbs) and keep those weights — on the SS21 curve ≈ epoch 13. <b>Alternatives</b> (2p): dropout, L2 / weight-decay, a simpler/smaller model (also more data, augmentation).`},
  {t:"Dropout", w:"2024 Q10d-e", b:`Randomly zeroes each unit with prob p per forward pass ⇒ trains an ensemble of thinned, weight-sharing sub-networks; at test all units used (scaled) — an approximate model average, i.e. functionally like <b>bagging</b>. Prevents co-adaptation ⇒ regularisation. <b>Rate</b>: higher p ⇒ <b>stronger regularisation</b> (too high ⇒ underfit; typical 0.2–0.5).`},
  {t:"LR curves", w:"2024 Q4", b:`<b>high</b>=jagged/diverges (overshoot) · <b>good</b>=fast smooth drop→low plateau · <b>low</b>=smooth but too slow · <b>zero</b>=flat.`}
 ]}
 ]
};
function cheatSide2(items){
 return `<div class="cicols">`+items.map(i=>
   `<div class="ci"><div class="ch">${esc(i.t)}<span class="cw">${esc(i.w||'')}</span></div><div class="cb">${i.b}</div></div>`
 ).join('')+`</div>`;
}
function renderCheat2(){
 let h=`<div class="cheat2"><h1>Cheat sheet V2 — tier-ordered, print-ready</h1>
   <p class="sub">${CHEAT2.note}</p>
   <div class="note good"><div class="h">How to use</div>This side is <b>formula-only for numericals</b> (no worked prose) and <b>complete for theory</b>. It's ordered T1→T6 so you transcribe in frequency order. The current <a href="#cheat">Cheat sheet</a> tab (Bank A / Bank B split) is unchanged — this is the alternate layout.</div>`;
 CHEAT2.tiers.forEach(g=>{
   h+=`<div class="c2grp"><h2 class="c2h">${esc(g.label)}</h2>${cheatSide2(g.items)}</div>`;
 });
 h+=`</div>`;
 return h;
}
/* ---- MARKS: verified per-question point values, read from the actual papers.
   SS21 & SoSe25 reconstruct exactly to their stated totals (fully verified);
   2024 & WiSe25/26 only annotate some questions in source (partial — others
   show the register's type-range as a muted estimate); MT22/23 are solution
   protocols with NO point annotations. Static table — edit if better data appears. */
const MARKS = {
 total:{ SS21:92, MT22:null, MT23:null, '2024':100, SoSe25:100, 'WiSe25/26':100 },
 complete:{ SS21:true, SoSe25:true, '2024':false, 'WiSe25/26':false, MT22:false, MT23:false },
 q:{
  SS21:{1:5,2:4,3:12,4:8,5:6,6:12,7:2,8:2,9:6,10:7,11:5,12:5,13:5,14:6,15:2,16:5},
  '2024':{1:7,3:13,6:4,8:8,10:10},
  SoSe25:{1:6,2:2,3:7,4:6,5:18,6:12,7:7,8:8,9:4,10:12,11:7,12:11},
  'WiSe25/26':{1:6,2:2,3:7,8:8,10:12,11:7},
  MT22:{}, MT23:{}
 }
};
function ptsMid(p){ if(!p||p==='—')return null; const m=(''+p).match(/(\d+)\s*[–-]\s*(\d+)/); if(m)return ((+m[1])+(+m[2]))/2; const s=(''+p).match(/\d+/); return s?+s[0]:null; }
function renderCoverage(){
 const SITTINGS=["SS21","MT22","MT23","2024","SoSe25","WiSe25/26"];
 const map={}; SITTINGS.forEach(s=>map[s]=[]);
 REGISTER.forEach(r=>{
   (r.exams||'').split('·').forEach(tok=>{
     tok=tok.trim(); if(!tok)return;
     let labels=null,q=null;
     if(tok.indexOf('MT22/23')===0){ labels=['MT22','MT23']; q=tok.slice(7).trim(); }
     else if(tok.indexOf('WiSe25/26')===0){ labels=['WiSe25/26']; q=tok.slice(9).trim(); }
     else { const m=tok.match(/^(SS21|MT22|MT23|2024|SoSe25)\s+(.*)$/); if(m){ labels=[m[1]]; q=m[2].trim(); } }
     if(!labels)return;
     labels.forEach(L=>{ if(map[L]) map[L].push({q,type:r.type,blockId:r.blockId,tier:r.tier,bank:r.bank,pts:r.pts,built:built(r.blockId)}); });
   });
 });
 const qnum=q=>{const m=(q||'').match(/\d+/);return m?parseInt(m[0],10):99;};
 let h=`<h1>Coverage — every real paper, question by question</h1>
   <p class="sub">Each sitting's questions, inverted from the register and linked to the block that teaches it, with verified marks from the actual paper. "Built" = solvable now; "pending" = arrives in a later pass. Use this to confirm a whole paper before a timed run.</p>
   <div class="note acc"><div class="h">What this proves</div>The 31-type register is the exhaustive taxonomy of what this professor asks. If every question below is <b>built</b> and learned, you can solve every real past paper. The marks column is exact where read from the paper; SS21 &amp; SoSe25 are fully verified (they sum to the stated total), so their "solvable marks" number is real.</div>`;
 SITTINGS.forEach(S=>{
   const rows=map[S].slice().sort((a,b)=>qnum(a.q)-qnum(b.q));
   if(!rows.length)return;
   const n=rows.length, done=rows.filter(x=>x.built).length, pct=Math.round(100*done/n);
   // solvable marks (unique exam-question, all its rows built, exact mark known)
   const groups={};
   rows.forEach(x=>{const k=qnum(x.q); (groups[k]=groups[k]||{built:true}); if(!x.built)groups[k].built=false;});
   let solvable=0; Object.keys(groups).forEach(k=>{ const mk=(MARKS.q[S]||{})[k]; if(groups[k].built&&mk!=null)solvable+=mk; });
   const tot=MARKS.total[S];
   let head=`${done}/${n} question-types built (${pct}%)`;
   if(tot!=null && MARKS.complete[S]) head+=` &nbsp;·&nbsp; <b>solvable now ≈ ${solvable}/${tot} marks</b>`;
   else if(tot!=null) head+=` &nbsp;·&nbsp; total ${tot} marks (some marks unverified)`;
   else head+=` &nbsp;·&nbsp; marks not stated in source protocol`;
   h+=`<h2>${esc(S)} <span class="sub">— ${head}</span></h2>
     <div class="progress"><i style="width:${pct}%"></i></div>`;
   rows.forEach(x=>{
     const ex=(MARKS.q[S]||{})[qnum(x.q)];
     const est=ptsMid(x.pts);
     const mcell = ex!=null ? `${ex}p` : (est!=null?`~${est}p`:'—');
     const mclass = ex!=null ? '' : 'est';
     h+=`<div class="covrow">
       <span class="cq">${esc(x.q)}</span>
       <span>${x.built?`<a href="#block/${x.blockId}">${esc(x.type)}</a>`:esc(x.type)}</span>
       <span class="sub">T${x.tier} · ${x.bank}</span>
       <span class="cm ${mclass}">${mcell}</span>
       <span class="cs" style="color:${x.built?'var(--good)':'var(--warn)'}">${x.built?'built':'pending'}</span>
     </div>`;
   });
 });
 h+=`<p class="sub" style="margin-top:16px">Marks: <b>Np</b> = read exactly from that paper; <b>~Np</b> = register type-range estimate (grey), not read from that specific paper; <b>—</b> = source states no marks. <b>SS21</b> (92p) and <b>SoSe25</b> (100p) reconstruct exactly to their stated totals — their solvable-marks readouts are real. <b>2024</b> &amp; <b>WiSe25/26</b> are HedgeDoc protocols that annotate only some questions, so a few marks are estimates. <b>MT22/23</b> are solution-only protocols with no point annotations. Mapping is by recurring question type (the register taxonomy).</p>`;
 return h;
}

function renderTracker(){
 let h=`<h1>Tracker</h1>`;
 const tiers=[1,2,3,4,5,6];
 h+=`<div class="topbar"><span class="grow sub">Progress persists in this browser (localStorage).</span>
   <button class="btn" onclick="expJSON()">export JSON</button>
   <button class="btn" onclick="document.getElementById('imp').click()">import JSON</button>
   <input id="imp" type="file" accept="application/json" style="display:none" onchange="impJSON(event)">
   <button class="btn" onclick="toggleTheme()">theme</button></div>`;
 tiers.forEach(t=>{
   const rows=REGISTER.filter(r=>r.tier===t);if(!rows.length)return;
   const bl=rows.filter(r=>built(r.blockId));
   const doneN=bl.filter(r=>isDone('block:'+r.blockId)).length;
   const pct=bl.length?Math.round(100*doneN/bl.length):0;
   h+=`<h3><span class="pill t${t}">TIER ${t}</span> ${doneN}/${bl.length} built-blocks learned <span class="sub">(${rows.length-bl.length} pending build)</span></h3>
     <div class="progress"><i style="width:${pct}%"></i></div>`;
   rows.forEach(r=>{
     const b=built(r.blockId), d=isDone('block:'+r.blockId);
     h+=`<div class="regrow"><span class="pill t${t}">${r.bank}</span>
       <span>${b?`<a href="#block/${r.blockId}">${esc(r.type)}</a>`:esc(r.type)}</span>
       <span class="ex">${esc(r.exams)}</span>
       <span class="ptc mono" style="text-align:right;color:${!b?'var(--warn)':(d?'var(--good)':'var(--mut)')}">${!b?'pending':(d?'learned':'built')}</span></div>`;
   });
 });
 return h;
}

/* =========================== ACTIONS =========================== */
function toggle(k){setDone(k,!isDone(k));render();}
function expJSON(){const blob=new Blob([JSON.stringify({done:DONE,build:BUILD},null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='dlam_progress.json';a.click();}
function impJSON(ev){const f=ev.target.files[0];if(!f)return;const rd=new FileReader();
 rd.onload=()=>{try{const o=JSON.parse(rd.result);if(o.done){DONE=o.done;save('dlam.done',DONE);render();}}catch(e){alert('bad JSON')}};
 rd.readAsText(f);ev.target.value='';}
function initTheme(){const t=load('dlam.theme','dark');if(t==='light')document.documentElement.setAttribute('data-theme','light');}
function toggleTheme(){const cur=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';
 if(cur==='light')document.documentElement.setAttribute('data-theme','light');else document.documentElement.removeAttribute('data-theme');
 save('dlam.theme',cur);}

/* =========================== RENDER =========================== */
function render(){
 renderRail();
 const [view,arg]=parseHash();
 let h='';
 if(view==='register')h=renderRegister();
 else if(view==='cheat')h=renderCheat();
 else if(view==='cheat2')h=renderCheat2();
 else if(view==='coverage')h=renderCoverage();
 else if(view==='block')h=renderBlock(arg);
 else if(view==='worked')h=renderWorked();
 else if(view==='craft')h=renderCraft();
 else if(view==='triage')h=renderTriage();
 else if(view==='anki')h=renderAnki();
 else if(view==='tracker')h=renderTracker();
 else h=renderRegister();
 const main=document.getElementById('main');
 main.innerHTML=h;main.scrollTop=0;
 if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([main]);
}
initTheme();
render();
console.log('%cDLAM roadmap '+BUILD+' — blocks:'+RM.blocks.length+'/'+REGISTER.length,'color:#6aa9ff');
</script>
