:root{

a{color:var(--acc);text-decoration:none}

code{font-family:var(--mono);font-size:.9em;background:var(--panel2);padding:.08em .35em;border-radius:4px}
.kw{color:var(--kw);font-weight:600}
.layout{display:grid;grid-template-columns:250px 1fr;min-height:100vh}

#rail{border-right:1px solid var(--line);background:var(--panel);padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-weight:700;letter-spacing:.5px;font-size:15px;margin:2px 6px 4px}
.brand small{display:block;color:var(--mut);font-weight:400;font-size:11px;letter-spacing:.3px}
.railgrp{margin-top:14px}
.railgrp h4{margin:0 6px 6px;font-size:10.5px;text-transform:uppercase;letter-spacing:1.2px;color:var(--dim)}
.rbtn{display:flex;justify-content:space-between;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;color:var(--tx);

.rbtn:hover{background:var(--panel2)}
.rbtn.on{background:var(--panel2);border-left-color:var(--acc);color:var(--acc)}
.rbtn .pt{color:var(--dim);font-size:10px;font-family:var(--mono)}

.covrow .cm.est{color:var(--dim)}
.covrow .cs{text-align:right;font-family:var(--mono);font-size:11px}

.mono{font-family:var(--mono)}

 lede:"The one question you cannot afford to fumble — 6/6 sittings, 12–18 marks, pure mechanics. A gradient flows in from the right, you multiply by a local derivative, you write a number, you move one node left. There are only two graph families the examiner has ever used: a ReLU chain with a skip (SS21, WiSe, MT), and a logistic-sigmoid circuit (2024, SoSe25). Below, both are worked end-to-end, every position, in the exact order and format you write on the sheet.",

  {h:"The gate rules — these ARE the question", src:"tracker T1 · Anki 3_backpropagation", note:{c:"acc",h:"Nothing else is being tested",b:"Every graph reduces to these rules applied node by node, right to left. If they are reflex, the question is arithmetic. If you have to think about them, you will run out of time or slip — and a slip is a full miss."},
   body:"Backprop runs <b>right → left</b>. Each node takes the <span class='kw'>upstream gradient</span> \\(g\\) arriving on its output edge, multiplies by its own <span class='kw'>local derivative</span> (evaluated at the forward value), and sends the product up each input edge.<br><br>"+
   "<table><tr><th>Gate</th><th>Local derivative</th><th>What you send upstream</th></tr>"+
   "<tr><td><b>+</b> add</td><td>\\(\\partial(x+y)/\\partial x = 1\\)</td><td><b>Copy</b> \\(g\\) unchanged to <i>every</i> input. (Add = gradient distributor.)</td></tr>"+
   "<tr><td><b>×</b> mult</td><td>\\(\\partial(xy)/\\partial x = y\\)</td><td>Each input gets \\(g\\times\\) the <b>other</b> input's forward value. (Mult = value switcher.)</td></tr>"+
   "<tr><td><b>max</b></td><td>\\(1\\) to the winner, \\(0\\) else</td><td>Route \\(g\\) to whichever input <b>was</b> larger in the forward pass; \\(0\\) to the rest. (Max = router.)</td></tr>"+

   "<tr><td><b>sigmoid</b> \\(\\sigma\\)</td><td>\\(\\sigma(z)(1-\\sigma(z))\\)</td><td>\\(g\\cdot \\sigma(z)(1-\\sigma(z))\\). Shortcut: if the node's forward <i>output</i> is \\(o\\), local deriv \\(=o(1-o)\\).</td></tr>"+
   "<tr><td><b>\\(e^{x}\\)</b> exp</td><td>\\(e^{x}\\)</td><td>\\(g\\cdot e^{x}\\) = \\(g\\times\\) the node's own forward <i>output</i>.</td></tr>"+
   "<tr><td><b>\\(1/x\\)</b></td><td>\\(-1/x^2\\)</td><td>\\(g\\cdot(-1/x^2)\\), \\(x\\) = forward input to the gate.</td></tr>"+
   "<tr><td><b>\\(c+x\\)</b> const-add</td><td>\\(1\\)</td><td>\\(g\\) unchanged (the \\(+1\\) node in a sigmoid circuit).</td></tr>"+
   "<tr><td><b>\\(a\\cdot x\\)</b> scale by const</td><td>\\(a\\)</td><td>\\(g\\cdot a\\) (the \\(\\times(-1)\\) node in a sigmoid circuit sends \\(-g\\)).</td></tr>"+
   "</table>"+
   "<div class='note warn'><div class='h'>The branch rule — the single most-missed step</div>When one node's output feeds <b>two</b> downstream edges (a skip connection, or a variable reused twice in the formula), the two paths each send a gradient back. You <b>add them</b> before going further upstream. Miss this and every gradient upstream of the branch is wrong.</div>"+
   "<div class='note'><div class='h'>Why it's just the chain rule</div>Conceptually you already know this: \\(\\frac{\\partial L}{\\partial x}=\\frac{\\partial L}{\\partial u}\\frac{\\partial u}{\\partial x}\\). \"Upstream gradient\" is \\(\\partial L/\\partial u\\); \"local derivative\" is \\(\\partial u/\\partial x\\). The graph just lets you do it one multiply at a time instead of expanding a giant expression. That's the entire trick — the rest is bookkeeping.</div>"},

   "<li>At each node: local derivative × incoming gradient = gradient to write on each input edge.</li>"+
   "<li><b>At any branch, sum</b> the gradients returning from the two paths.</li>"+
   "<li>Write your answers in the exact numbered order the question lists (\"14:, 13:, … 1:\"). Label them so the marker can follow — partial credit is per-position.</li>"+

RM.blocks.push({
 id:"t3-spn", tier:3, code:"T3", bank:"A",
 title:"Sum-Product Networks — EVI / MAR / MAP queries",
 exams:"SS21 Q6 · 2024 Q6 · SoSe25 Q9 · WiSe25/26 Q9",
 points:"4 (in 4 sittings)",
 lede:"A pure bottom-up evaluation. Set each leaf indicator (1 if consistent with the query, 0 if not; 1 for a variable being summed out), then propagate: × nodes multiply their children, + nodes take the weighted sum of their children. EVI = full evidence, MAR = set summed-out leaves to 1, MAP = evaluate for each value of the target variable and pick the argmax. SS21's network (below) is worked for all five sub-queries.",
 why:"4/6 sittings, 4 marks, and it is arithmetic with a fixed recipe — no modelling judgement required. The only ways to lose marks are mislabelling a leaf indicator, forgetting to set summed-out leaves to 1, or not showing the intermediate node values.",
 sections:[
  {h:"The three leaf rules + two node rules", src:"tracker T3 · L10 Deep Prob. Models",
   note:{c:"acc",h:"Leaf indicators are the whole game",b:"\\(x_i=1\\) means \"\\(X_i\\) is TRUE\", \\(\\bar x_i=1\\) means \"\\(X_i\\) is FALSE\". For a query you SET these: consistent→1, inconsistent→0, summed-out→BOTH =1."},
   body:"<b>Leaf setting</b> for variable \\(X_i\\):<ul>"+
   "<li>observed TRUE: \\(x_i=1,\\;\\bar x_i=0\\).</li>"+
   "<li>observed FALSE: \\(x_i=0,\\;\\bar x_i=1\\).</li>"+
   "<li>not mentioned (marginalise / sum out): \\(x_i=1,\\;\\bar x_i=1\\).</li></ul>"+
   "<b>Node rules</b> (evaluate bottom-up): a <b>product</b> node outputs \\(\\prod\\) of its children; a <b>sum</b> node outputs \\(\\sum_k w_k\\cdot(\\text{child}_k)\\) with the edge weights \\(w_k\\).<br><br>"+
   "<b>Query types:</b> <b>EVI</b> — all variables observed, read the root. <b>MAR</b> — some variables summed out (their leaves =1), read the root. <b>MAP/argmax</b> — evaluate the network once per candidate value of the target variable(s), pick the value giving the largest root."},
  {h:"SS21 network (used in the worked examples)", src:"SS21 Q6 (scanned)",
   body:"<pre style='font-family:var(--mono);font-size:11.5px;background:var(--code-bg);color:var(--code-fg);padding:10px;border-radius:6px'>"+
"                 (+)  root:  0.7*L + 0.3*R\n"+
"           0.7 /     \\ 0.3\n"+
"          (x)L         (x)R\n"+
"        / |             | \\\n"+
"      x1  S1   S3     S2  S4   x1bar\n"+
"           (over X2/X3, see below)\n"+
"\n"+
"  L = x1 * S1 * S3        R = x1bar * S2 * S4\n"+
"  S1 = 0.7*x2 + 0.3*x2bar     S2 = 0.5*x2 + 0.5*x2bar\n"+
"  S3 = 0.9*x3 + 0.1*x3bar     S4 = 0.6*x3 + 0.4*x3bar</pre>"+
   "Each product node is complete/decomposable: one \\(X_1\\) leaf, one sum over \\(X_2\\), one sum over \\(X_3\\). Left product uses \\(x_1,S_1,S_3\\); right uses \\(\\bar x_1,S_2,S_4\\)."}
 ],
 worked:[
  {h:"WORKED — SS21 Q6, all five sub-queries on the network above",
   q:"a) \\(P(X_1{=}1,X_2{=}0,X_3{=}0)\\)  b) \\(P(X_1{=}1,X_2{=}1)\\)  c) \\(P(X_1{=}0)\\)  d) \\(\\arg\\max_x P(X_2{=}x)\\)  e) \\(\\arg\\max_{x,y} P(X_2{=}x,X_3{=}y)\\). \"Write all the steps.\"",
   intro:"For every sub-query: set the six leaves, evaluate \\(S_1..S_4\\), then the two product nodes, then the root. Do it mechanically.",
   fwd:[["S-nodes","S1,S2 over X2 · S3,S4 over X3"],["products","L=x1·S1·S3 , R=x1bar·S2·S4"],["root","0.7·L + 0.3·R"]],
   steps:[
    ["a) EVI \\(P(X_1{=}1,X_2{=}0,X_3{=}0)\\).","Leaves: \\(x_1{=}1,\\bar x_1{=}0\\); \\(x_2{=}0,\\bar x_2{=}1\\); \\(x_3{=}0,\\bar x_3{=}1\\).<br>\\(S_1=0.3,\\,S_2=0.5,\\,S_3=0.1,\\,S_4=0.4\\).<br>\\(L=1\\cdot0.3\\cdot0.1=0.03\\); \\(R=0\\cdot0.5\\cdot0.4=0\\).<br>root \\(=0.7(0.03)+0.3(0)=\\mathbf{0.021}\\)."],
    ["b) MAR \\(P(X_1{=}1,X_2{=}1)\\) — sum out \\(X_3\\).","Leaves: \\(x_1{=}1,\\bar x_1{=}0\\); \\(x_2{=}1,\\bar x_2{=}0\\); \\(x_3{=}1,\\bar x_3{=}1\\).<br>\\(S_1=0.7,\\,S_2=0.5,\\,S_3=0.9{+}0.1=1.0,\\,S_4=0.6{+}0.4=1.0\\).<br>\\(L=1\\cdot0.7\\cdot1.0=0.7\\); \\(R=0\\).<br>root \\(=0.7(0.7)=\\mathbf{0.49}\\)."],
    ["c) MAR \\(P(X_1{=}0)\\) — sum out \\(X_2,X_3\\).","Leaves: \\(x_1{=}0,\\bar x_1{=}1\\); all others \\(=1\\).<br>\\(S_1=S_2=S_3=S_4=1.0\\).<br>\\(L=0\\cdot1\\cdot1=0\\); \\(R=1\\cdot1\\cdot1=1\\).<br>root \\(=0.7(0)+0.3(1)=\\mathbf{0.3}\\). (Sanity: \\(P(X_1{=}1)=0.7\\), so \\(P(X_1{=}0)=0.3\\).)"],
    ["d) MAP \\(\\arg\\max_x P(X_2{=}x)\\) — sum out \\(X_1,X_3\\), try both \\(x\\).","<b>\\(X_2{=}1\\):</b> \\(x_2{=}1,\\bar x_2{=}0\\); \\(x_1{=}\\bar x_1{=}1\\); \\(x_3{=}\\bar x_3{=}1\\).<br>\\(S_1=0.7,S_2=0.5,S_3=1,S_4=1\\); \\(L=1\\cdot0.7\\cdot1=0.7\\), \\(R=1\\cdot0.5\\cdot1=0.5\\); root \\(=0.7(0.7)+0.3(0.5)=0.49+0.15=0.64\\).<br><b>\\(X_2{=}0\\):</b> \\(S_1=0.3,S_2=0.5\\); \\(L=0.3\\), \\(R=0.5\\); root \\(=0.7(0.3)+0.3(0.5)=0.21+0.15=0.36\\).<br>\\(0.64>0.36\\Rightarrow \\arg\\max=\\mathbf{X_2{=}1}\\)."],
    ["e) MAP \\(\\arg\\max_{x,y} P(X_2{=}x,X_3{=}y)\\) — sum out \\(X_1\\), try all 4.","With \\(x_1{=}\\bar x_1{=}1\\), root \\(=0.7(S_1S_3)+0.3(S_2S_4)\\). Note \\(S_2=0.5\\) always.<br>\\((1,1)\\): \\(0.7(0.7\\cdot0.9)+0.3(0.5\\cdot0.6)=0.441+0.09=\\mathbf{0.531}\\)<br>\\((1,0)\\): \\(0.7(0.7\\cdot0.1)+0.3(0.5\\cdot0.4)=0.049+0.06=0.109\\)<br>\\((0,1)\\): \\(0.7(0.3\\cdot0.9)+0.3(0.5\\cdot0.6)=0.189+0.09=0.279\\)<br>\\((0,0)\\): \\(0.7(0.3\\cdot0.1)+0.3(0.5\\cdot0.4)=0.021+0.06=0.081\\)<br>Sum \\(=1.0\\) ✓. \\(\\arg\\max=\\mathbf{(X_2{=}1,\\,X_3{=}1)}\\), \\(P=0.531\\)."]
   ],
   answer:[["a","0.021"],["b","0.49"],["c","0.3"],["d","X2=1 (.64)"],["e","X2=1,X3=1 (.531)"]],
   examwrite:"<div class='mono'>a) 0.021    b) 0.49    c) 0.3\nd) argmax P(X2): X2=1 (0.64 vs 0.36)\ne) argmax P(X2,X3): X2=1,X3=1 (0.531)</div><p style='margin:6px 0 0'>Show S1..S4, both products, and the root for each part — the marks are for the intermediate node values, not just the final number. For MAP show BOTH (all) candidates so the comparison is explicit.</p>"}
 ],
 variations:[
  {ex:"SS21 Q6 (a–e, 12p total)", d:"<b>Worked in full above.</b> The only sitting whose network + weights survived intact — treat it as the canonical SPN."},
  {ex:"2024 Q6", d:"Same style, asks \\(P(X_1{=}1,X_2{=}0,X_3{=}1)\\) (EVI) and \\(\\arg\\max_x P(X_2{=}x)\\) (MAP). Network diagram not preserved in the protocol. On SS21's network the EVI query evaluates to <b>0.189</b> (\\(S_1{=}0.3,S_3{=}0.9\\Rightarrow L{=}0.27,\\,R{=}0\\Rightarrow0.7\\cdot0.27\\)) — use it as a drill for that evidence pattern."},

 title:"Attention — formula, the three steps, and applying it",

   body:"\\[\\text{Attention}(Q,K,V)=\\operatorname{softmax}\\!\\left(\\frac{QK^\\top}{\\sqrt{d_k}}\\right)V,\\quad Q\\in\\mathbb R^{n\\times d_k},K\\in\\mathbb R^{n\\times d_k},V\\in\\mathbb R^{n\\times d_v}.\\]"+
   "<b>Step 4 — scores:</b> \\(QK^\\top\\) is the dot product of every query with every key; entry \\((i,j)\\) measures how relevant token \\(j\\) is to token \\(i\\). <b>Step 5 — normalise:</b> divide by \\(\\sqrt{d_k}\\) (keeps the dot products from growing with dimension and pushing softmax into saturation / tiny gradients), then <b>row-wise softmax</b> → each row is attention weights summing to 1. <b>Step 6 — apply:</b> multiply the weight matrix by \\(V\\) — each output row is the weighted average of the value vectors."},
  {h:"Why scale by √dₖ", src:"tracker T3",
   body:"If query/key entries are ~unit-variance and independent, a dot product of \\(d_k\\) terms has variance \\(\\sim d_k\\). Large magnitudes make softmax nearly one-hot, so its gradient ≈ 0. Dividing by \\(\\sqrt{d_k}\\) restores ~unit variance and healthy gradients."}

  {h:"SiLU (a.k.a. swish) local derivative", src:"tracker T5 · L5 training2 · 2024 Q5",
   note:{c:"acc",h:"Reuse-the-forward-value form",b:"An equivalent form is \\(\\text{SiLU}'(x)=\\text{SiLU}(x)+\\sigma(x)\\,(1-\\text{SiLU}(x))\\) — handy when you already computed \\(\\text{SiLU}(x)=x\\sigma(x)\\) and \\(\\sigma(x)\\) in the forward pass, so no new evaluations are needed."},
   body:"\\(\\text{SiLU}(x)=x\\cdot\\sigma(x)\\), a product of two things that both depend on \\(x\\) — so it is a <b>product rule</b>:<br>\\[\\frac{d}{dx}\\big(x\\,\\sigma(x)\\big)=\\underbrace{1\\cdot\\sigma(x)}_{\\text{first}\\times\\text{second}}+\\underbrace{x\\cdot\\sigma'(x)}_{\\text{first}\\times\\text{second}'}=\\sigma(x)+x\\,\\sigma(x)\\big(1-\\sigma(x)\\big).\\]"+
   "Inside a graph you can draw SiLU either as one node (use this whole derivative) or as an explicit \\(\\times\\) of an identity branch and a \\(\\sigma\\) branch (then it is just the T1 mult + sigmoid gates, and the reused \\(x\\) is a branch you sum over). Both give the same number."},

"t1-backprop":{
  test:"Whether you can run the chain rule mechanically along a computation graph — take the gradient coming in from the output side, multiply by the local derivative of the node you are at, write the number, move one node left. It is not asking you to <i>derive</i> backprop; it checks you can execute it fast and without slips.",
  idea:"A computation graph breaks a function into a chain of tiny operations — each node does one thing (add, multiply, ReLU, sigmoid, ...) and passes its result forward to the next. Training a network needs the gradient of the final loss with respect to every weight and input, and backpropagation is nothing more than the chain rule applied systematically along that graph.<br><br>The object that makes it work is the <b>local derivative</b>: for each node, how its output changes when its input changes, evaluated at the numbers from the forward pass. Backprop starts with a gradient of 1 at the output and moves right-to-left; at every node it multiplies the gradient arriving from the right by that node's local derivative to get the gradient on the node's input, then hands that leftward to the next node. Where one value fans out to several places, the gradients coming back along those branches are <i>summed</i>. So the whole method is: run the forward pass and record every intermediate value, then walk backward multiplying by local derivatives and adding at branch points. What makes it fast in an exam is knowing each gate's local derivative cold — an add gate passes the gradient through unchanged, a multiply gate sends each input the upstream gradient times the <i>other</i> input, a max gate routes the whole gradient to the winner, and sigmoid/ReLU each have their own — after which the question is just careful arithmetic."},
"t2-resnet":{
  test:"Whether you understand <i>why</i> skip connections matter, not just that ResNets have them. The marks come from tying the skip edge to gradient flow — the reason very deep nets became trainable at all.",
  idea:"ResNet (Residual Network) is the architecture that made <i>very</i> deep convolutional networks trainable. Before it, simply stacking more layers made accuracy saturate and then get worse — not from overfitting but because gradients had to pass back through every layer and tended to shrink to nothing (the vanishing-gradient problem), so early layers barely learned. ResNet's fix is the <b>residual block</b>: rather than asking a stack of layers to learn a full target mapping H(x), you let it learn only the <i>residual</i> F(x) = H(x) − x and add the input back through a <b>skip (shortcut) connection</b>, so the block outputs F(x) + x.<br><br>Two consequences matter. First, if the best thing a block can do is leave its input alone, it only has to push F(x) toward 0, which is easy to learn — so adding depth never hurts and can only help. Second, and this is what the exam rewards, that +x edge gives the gradient a direct route home: on the backward pass an addition passes the upstream gradient straight through to the input unchanged, running in parallel with the shrinking path through F. So even in a network hundreds of layers deep, a strong gradient signal still reaches the early layers, which is exactly why ResNets could train at 50, 100, even 1000 layers. In the exam a residual block is drawn as a small three-node graph — the layers F, the skip edge carrying x, and the + that merges them — and every advantage you list (trainable depth, better gradient flow, easy identity mapping) should trace back to that skip path."},
"t2-vanish":{
  test:"Whether you can tell two different failure modes apart — gradients shrinking toward zero (vanishing) vs. ReLU units getting permanently stuck (dying) — and back each with the derivative argument. There is a fixed trap sub-question about max-pooling.",
  idea:"Both are ways the learning signal is lost as gradients flow backward through a deep network, but the causes are different and the exam wants them cleanly separated. <b>Vanishing gradients</b> come from repeated multiplication by small numbers. Backprop multiplies the local derivatives of every layer together on the way back; if those derivatives are consistently below 1 — as with sigmoid, whose derivative maxes out at 0.25, or tanh in its flat regions — the product shrinks roughly exponentially with depth, so early layers receive almost no gradient and learn extremely slowly. It is fundamentally a <i>saturation</i> problem: the activation is operating in a flat region where its slope is tiny.<br><br><b>Dying ReLU</b> is a different, more permanent failure. ReLU outputs 0 for any negative input and has gradient exactly 0 there. If a unit's weights push its pre-activation negative for essentially all training inputs, it outputs 0 forever and receives 0 gradient forever, so it can never update — the unit is effectively dead. Leaky ReLU addresses this by giving negative inputs a small non-zero slope α, which keeps a little gradient alive so the unit can recover.<br><br>The recurring trap sub-question asks whether <b>max-pooling</b> contributes to vanishing gradients. It does not. Max-pooling has no weights, and on the backward pass it simply routes the incoming gradient to whichever input was the maximum (gradient 1 to the winner, 0 to the losers). It never multiplies the gradient by a factor below 1, so it cannot cause the exponential shrinkage that saturating activations do — that is the answer the examiner is looking for."},
"t2-gan":{
  test:"Whether you know how the two networks interact during training, and — the part that separates full marks from partial — what you actually keep at generation time.",
  idea:"A GAN (Generative Adversarial Network) is a method for learning to generate realistic data — images, most commonly — by training two networks in competition. The <b>generator</b> G takes a random noise vector z (sampled from a simple distribution) and maps it to a fake sample. The <b>discriminator</b> D takes a sample and outputs the probability that it is real (drawn from the training set) rather than generated. The two are trained together in a <i>minimax game</i>: D is trained to correctly separate real from fake, while G is trained to fool D into labelling its fakes as real. As training proceeds the two improve against each other — D gets sharper at spotting fakes, which forces G to produce ever more convincing samples. At the ideal equilibrium G's outputs are indistinguishable from real data and D is reduced to guessing (≈50%).<br><br>The part the exam specifically probes is what happens <i>after</i> training. The discriminator and the real training set exist only to provide a training signal for G — they are scaffolding. At generation (inference) time you use the generator alone: sample a noise vector z, push it through G, and read off the generated image. D is discarded entirely. So the two things worth nailing are the training diagram (noise → G → fake sample; real data + fake → D → real/fake decision) and the generation process, which is simply noise → G → image with no discriminator involved."},
"t3-convkernel":{
  test:"Two versions of one skill. Forward: can you slide a given kernel over an input and produce the feature map correctly. Inverse: given the output map and a kernel with blanks, can you set up and solve for the missing kernel values.",
  idea:"A convolution slides a small matrix of weights — the <b>kernel</b> (or filter) — across a larger input and produces a <b>feature map</b>. At each position the kernel sits over a patch of the input the same size as itself; you multiply each kernel weight by the input value beneath it and sum all those products into a single output number. Slide the kernel one step (the <i>stride</i>) and repeat, so the output cell at row i, column j is the weighted sum of the input patch positioned there. The same small set of weights is reused at every position — this <b>weight sharing</b> is what lets a CNN detect a given pattern anywhere in the image while using very few parameters, and it is the reason convolution is the workhorse operation of image models.<br><br>The forward task hands you the complete kernel and asks for the feature map, which is pure application of the sum-of-products, one output cell at a time. The inverse task is the same operation read backwards: it gives you the finished output map together with a kernel that has some entries blanked out, and asks you to recover them. Because each output cell is a linear combination of known input values and the unknown weights, every output cell you are given becomes one linear equation in those unknowns; collect as many equations as there are unknowns and solve the small linear system. The arithmetic is identical in both directions — the inverse just asks you to set up the equations instead of evaluating them, and (usefully) the professor tends to reuse the same input grid and kernel across papers, hiding only a row for the inverse version."},
"t3-pool":{
  test:"Two things: apply the output-size formula, and apply the pooling operation itself (average or max) to the grid.",
  idea:"Pooling <b>downsamples</b> a feature map — it reduces its spatial size while summarising the response in each region, which cuts computation for later layers and gives the network a little tolerance to small shifts in the input (translation invariance). It slides a window over the map much like convolution, but instead of a learned weighted sum it applies a fixed summary function: <b>max pooling</b> keeps the largest value in each window, <b>average pooling</b> takes the mean of the window. A key point the exam likes elsewhere is that pooling has <i>no learnable parameters</i> — the operation is fixed, so it contributes 0 to any parameter count and just routes gradient on the backward pass.<br><br>Two things are asked. The <b>output size</b> uses the same formula as convolution: N_out = ⌊(N − F)/S⌋ + 1, or with padding P, (N − F + 2P)/S + 1, where N is the input side length, F the window size, and S the stride. The everyday case is a 2×2 window with stride 2, which halves each spatial dimension and makes the windows non-overlapping — so you can just partition the map into 2×2 blocks and replace each block by its max or its average. Then you <b>apply</b> the operation to fill the output grid. Both the size and the grid are trivial in principle, so the only real risk is an arithmetic slip under time pressure; the marks are for getting every cell right."},
"t3-spn":{
  test:"Whether you can evaluate a sum-product network bottom-up for the three query types — full evidence (EVI), marginal (MAR), and MAP — and read the answer straight off the root.",
  idea:"A Sum-Product Network (SPN) is a deep probabilistic model that represents a whole probability distribution as a rooted graph built from three kinds of node: <b>leaf</b> nodes (indicators, or simple distributions, over single variables), <b>product</b> nodes (which combine independent sub-parts by multiplying their values), and <b>sum</b> nodes (weighted mixtures of their children, with non-negative weights that sum to 1). Its defining advantage is <b>tractable inference</b>: because the model is composed only of sums and products arranged in a valid structure, many queries that are expensive or intractable in general graphical models can be answered <i>exactly</i> by a single bottom-up pass through the graph — the value computed at the root is the answer.<br><br>You evaluate it by setting the leaf indicators according to the query and then propagating upward: each product node multiplies its children's values, each sum node takes the weighted sum of its children. The three query types differ only in how the leaves are set. <b>EVI</b> (evidence) is the probability of a fully specified assignment of all variables — set each variable's indicator consistent with the assignment to 1 and the inconsistent ones to 0. <b>MAR</b> (marginal) leaves some variables unspecified — you marginalise a variable out by setting <i>all</i> of its indicators to 1, which makes the network sum over its possible values automatically. <b>MAP</b> (most probable value of a target) means evaluating the network once for each candidate value of the target and taking the argmax. The marks reward showing the intermediate node values, so write them out as you propagate rather than jumping to the root."},
"t3-attn":{
  test:"The same three points every sitting: the score formula and what it measures, the softmax normalisation, and how the result is applied — plus a numeric computation if vectors are handed to you.",
  idea:"Attention lets a model decide, separately for each position, which other positions to pull information from, instead of treating all context equally. Every element produces three vectors: a <b>query</b> q (what this position is looking for), a <b>key</b> k (what a position offers as a match target), and a <b>value</b> v (the content a position will contribute). To produce the output for one query you <i>score</i> it against every key with a dot product — a large dot product means the query and that key are aligned, i.e. that position is relevant. The scores are turned into weights by a row-wise <b>softmax</b>, so they are non-negative and sum to 1, and the output is the softmax-weighted sum of the value vectors. A position with a high score therefore contributes most of its value to the result.<br><br>Written for a whole sequence at once: Attention(Q, K, V) = softmax(QKᵀ / √dₖ) · V. The subtlety the exam rewards is the <b>√dₖ scaling</b>. When the key dimension dₖ is large, the raw dot products tend to grow large in magnitude, which pushes the softmax into a saturated regime where one weight is ≈1 and the rest ≈0 and the gradient through it nearly vanishes; dividing every score by √dₖ (the square root of the key dimension) keeps them in a moderate range so the softmax stays smooth and trainable. Know the three steps — score, normalise, weighted sum — the formula, and the reason for the scaling; when vectors are given you just execute those three steps numerically."},
"t3-rnn2tf":{
  test:"Whether you can name two concrete RNN limitations the Transformer removes, and give the per-layer complexity figures.",
  idea:"A recurrent neural network (RNN) reads a sequence one element at a time, carrying a hidden state forward from step to step. That design creates two structural weaknesses. First, it is inherently <b>sequential</b>: step t cannot be computed until step t−1 has finished, so the computation over the sequence cannot be parallelised — training and inference are slow on long inputs. Second, for an early token to influence a much later one, its information has to survive being repeatedly transformed through every intervening step, and across many steps that signal tends to vanish — so RNNs struggle to capture <b>long-range dependencies</b>.<br><br>The Transformer removes recurrence entirely and uses <b>self-attention</b> instead: within a single layer, every position attends directly to every other position. This makes the model fully <i>parallel</i> across the sequence (all positions are computed at once rather than in order) and gives any two tokens a direct, constant-length path to each other regardless of how far apart they are, so long-range dependencies are captured far more easily. The cost is per-layer complexity: self-attention compares every position with every other, making it O(n²·d) in sequence length n and representation width d, whereas an RNN layer is O(n·d²). For the sequence lengths typical in practice (n smaller than d) this trade is favourable, which is why the exam asks for both the two problems solved and the two big-O figures."},
"t3-ethics":{
  test:"Whether you can list several <i>distinct</i> ethical problems with large LLMs, one crisp sentence each. Breadth of distinct points beats depth on any one of them.",
  idea:"Large language models are trained on enormous, largely uncurated collections of internet text, and most of their ethical problems trace back to that fact combined with their scale and their fluency (which makes their mistakes persuasive). The standard issues the exam expects you to be able to name and describe in one sentence each are: <b>bias and toxicity</b> — the model absorbs and can reproduce or even amplify the stereotypes, prejudices, and harmful language present in its training data; <b>misinformation and hallucination</b> — it produces fluent, confident text that can be simply false, and can be used to mass-produce convincing disinformation; <b>privacy</b> — training data may contain personal information that the model memorises and can leak at generation time; <b>environmental and resource cost</b> — training and serving very large models consumes large amounts of energy and compute, concentrated in a few well-resourced organisations, which also raises concerns about <i>access and concentration of power</i>; and <b>misuse and accountability</b> — the same capabilities enable spam, fraud, plagiarism, and manipulation, and it is often unclear who is responsible when an output causes harm.<br><br>Because the question is open-ended and worth only a few marks, the winning strategy is breadth, not depth: give three or four <i>distinct</i> issues, one clear sentence each, rather than writing a long paragraph on a single one and running out of separate points."},
"t4-buildgraph":{
  test:"The mirror image of the backprop question: you are given the formula act(w·x+b) and must <i>draw</i> the low-level computation graph from primitive gates, wiring the products, the sum-tree, the bias, and the activation correctly.",
  idea:"This is the inverse of the Tier-1 backprop task. There you were handed a graph and asked for gradients; here you are handed a formula — act(w·x + b) — and asked to <i>draw</i> the low-level computation graph that computes it from primitive operations. The underlying idea is that a compact expression is really just a sequence of elementary gates, and the marks reward showing you can unfold it.<br><br>The pre-activation w·x + b always has the same skeleton. The dot product w·x is a set of <b>multiply</b> gates, one per term wᵢxᵢ; their outputs feed a tree of <b>add</b> gates that sum them; and one further add gate folds in the bias b. That yields the scalar pre-activation. The <b>activation</b> then sits on top, and this is the only part that changes between papers: if it is Leaky ReLU, max(0, αx), you draw it as its primitive pieces (a scaling by α and a max); if it is a sigmoid, you expand it into the same negate → exp → +1 → reciprocal chain used in the Tier-1 sigmoid circuit. Because marks are awarded per node and edge, the two classic ways to lose them are (a) drawing the activation as a single unopened black box when the question wants its internal gates, and (b) forgetting the bias node. Label every wire and every gate; the labelled graph is the answer."},
"t4-activ":{
  test:"Pure recall: for sigmoid and Leaky ReLU give the expression, the derivative, and the ranges (of the function and of its derivative). The one live trap is the Leaky-ReLU slope constant, which the professor changes between papers.",
  idea:"Activation functions are the non-linearities placed after each layer's linear step. They matter because without them a stack of linear layers would collapse into a single linear map — the activation is what lets a deep network represent complex, non-linear functions. This question is pure recall of two of them, and, importantly, of <i>why</i> their derivatives behave as they do.<br><br><b>Sigmoid</b>, σ(x) = 1/(1 + e⁻ˣ), squashes any real input into the range (0, 1). Its derivative is σ'(x) = σ(x)(1 − σ(x)), which peaks at just 0.25 (at x = 0) and falls toward 0 for large |x|. That small, easily-saturated derivative is precisely the mechanism behind vanishing gradients in deep sigmoid networks — it is the number that gets multiplied together across layers. <b>Leaky ReLU</b>, f(x) = x for x ≥ 0 and αx for x < 0, passes positive inputs through unchanged and gives negative inputs a small slope α; its derivative is 1 for x > 0 and α for x < 0. Because that negative-side slope is non-zero, a Leaky-ReLU unit keeps receiving gradient even when its input is negative, which is exactly why it avoids the dying-ReLU problem that plain ReLU can suffer. The one live trap is that the professor varies the slope constant between papers (α = 0.04 in 2024/SoSe25, ε = 0.01 in WiSe25/26), so always cite the value from the paper in front of you. All four items — the two expressions, the two derivatives, and their ranges — belong on the cheat sheet."},
"t4-bn":{
  test:"Two parts: write the batch-norm formula, and give one advantage together with the mechanism behind it.",
  idea:"Batch Normalization is a layer inserted between a linear step and its activation that keeps the distribution of each activation stable throughout training. The motivation: as the weights of earlier layers update, the distribution of inputs seen by later layers keeps shifting (often called internal covariate shift), which slows and destabilises learning. BatchNorm counteracts this by re-standardising activations on every mini-batch so downstream layers always see a well-behaved input distribution.<br><br>For each activation it computes the mean μ and standard deviation σ over the current mini-batch and normalises: x̂ = (x − μ)/σ, giving values that are roughly zero-mean and unit-variance. But forcing every activation to a fixed distribution would throw away representational capacity, so BatchNorm then applies a <b>learned scale g and shift b</b>: the output is h = g·x̂ + b (the professor writes it hᵢ = gᵢ·(aᵢ − μᵢ)/σᵢ + bᵢ). Those learned parameters let the network rescale, or even undo, the normalisation wherever that is actually what it needs — which is why they must appear in your formula. The benefits all follow from keeping activations well-scaled: faster and more stable training, tolerance of higher learning rates, reduced sensitivity to weight initialisation, and a mild regularising effect from the noise in each mini-batch's statistics. The two ways to lose marks are writing the normalisation without the learned g, b, and stating an advantage without naming the mechanism that produces it."},
"t4-biasvar":{
  test:"One directional claim stated the right way round — how the number of hidden units trades bias against variance — plus the 'network as feature extractor' justification that SoSe25 adds.",
  idea:"The bias–variance tradeoff describes how a model's capacity affects its ability to generalise. <b>Bias</b> is error from the model being too simple to capture the true underlying pattern — it underfits. <b>Variance</b> is error from the model being so flexible that it fits the noise in the particular training set and then fails on new data — it overfits. Total generalisation error balances the two, and the number of hidden units acts as a direct capacity dial. Fewer hidden units ⇒ a simpler, more constrained model ⇒ higher bias and lower variance (tending toward underfitting). More hidden units ⇒ a more flexible model ⇒ lower bias and higher variance (tending toward overfitting). The exam simply wants that direction stated the right way round, plus one sentence of mechanism.<br><br>SoSe25 adds a second part: justify that a neural network acts as a <b>feature extractor</b>. The idea is that the hidden layers progressively transform the raw input into a new, learned representation, and the final layer is essentially a simple (often linear) classifier operating on that representation. So the network is not merely classifying — its earlier layers are automatically discovering the features that make the final classification easy, taking over the role that manual feature engineering played in classical machine learning."},
"t5-params":{
  test:"Whether you can count trainable parameters layer by layer and sum them, applying the right formula to conv, pooling, and fully-connected layers — with the bias terms included.",
  idea:"Counting a network's trainable parameters means adding up, for every layer, its weights plus its biases — the numbers that gradient descent actually updates. Each layer type has a simple formula. A <b>convolutional</b> layer has one kernel per output channel, and each kernel has F·F·C_in weights (its spatial size F×F times the number of input channels C_in) plus one bias, so the layer holds (F·F·C_in + 1)·C_out parameters. A useful sanity point: this count does <i>not</i> depend on the spatial size of the feature map, precisely because the same kernel is shared across all positions. A <b>pooling</b> layer has 0 parameters — it applies a fixed operation (max or average) with nothing to learn. A <b>fully-connected</b> layer mapping n_in inputs to n_out outputs has a weight for every input–output pair plus one bias per output unit, giving (n_in + 1)·n_out parameters.<br><br>You apply the right formula to each layer in turn and sum the results. The single most commonly dropped mark is the <b>+1 bias term</b> — one per filter in a conv layer, one per unit in an FC layer — so build the habit of writing that +1 every single time. There is no modelling judgement anywhere in this question; it is deterministic arithmetic, which makes it reliable marks once the three formulas and the bias rule are reflexive."},
"t5-silubn":{
  test:"The same backprop walk as Tier 1, but with two extra node types — SiLU and BatchNorm — whose local derivatives you have to know and apply inside the graph.",
  idea:"This is the standard backprop-on-a-graph question with two less-common node types dropped in, so the only genuinely new thing to learn is their <b>local derivatives</b> — the method around them is exactly the Tier-1 walk. <b>SiLU</b> (also called swish) is the smooth activation f(x) = x·σ(x), the input multiplied by its own sigmoid. By the product rule its derivative is σ(x) + x·σ(x)(1 − σ(x)), which you should be able to write down and evaluate at a given x. <b>BatchNorm</b> as a graph node computes γ·x̂ + β with x̂ = (x − μ)/√(σ² + ε); when the batch statistics μ and σ² are treated as given constants — as the exam does — the node's local derivative with respect to its input is simply γ/√(σ² + ε).<br><br>With those two derivatives in hand, the whole question collapses to the Tier-1 procedure. Run the forward pass through the graph (typically w·x → SiLU → BN), recording every intermediate value, then walk backward multiplying the gradient arriving from the right by each node's local derivative — using the SiLU and BN derivatives above at those two nodes and the ordinary add/multiply rules everywhere else. If SiLU and BatchNorm are the only unfamiliar pieces and you have their local derivatives memorised, you already know how to do the rest of the walk."},
"t5-maxgate":{
  test:"Whether you know how a max node passes gradient backward — it is a routing rule, not a multiplication.",
  idea:"A max node computes the maximum of its inputs, and the exam checks that you know how gradient flows back through it — which is a <b>routing</b> rule, not a scaling one. In the forward pass exactly one input is the largest and its value becomes the node's output. In the backward pass the node behaves like a switch: the entire incoming gradient is passed to whichever input <i>won</i> (was the maximum), and every other input receives 0. Nothing is multiplied or shrunk — the gradient is simply directed to the winner.<br><br>This single rule reappears in several places, which is why it is worth banking cleanly once. <b>Max-pooling</b> is a max over each window, so its backward pass routes the gradient to the position that held the window's maximum and sends 0 elsewhere. <b>ReLU</b> is max(0, x), so for a positive input the gradient passes straight through (x beat 0) and for a negative input it is killed (0 won) — which is also the mechanism behind the dying-ReLU problem. In the rare case of a tie the usual convention is to send the gradient to one winner (or split it evenly), but the exam almost never hinges on that. State it as: forward = take the max; backward = full gradient to the arg-max input, 0 to the rest."},
"t5-lstm":{
  test:"Whether you can write the four gate equations, fill them numerically for one step, and explain why an LSTM handles long-range dependencies where a vanilla RNN does not.",
  idea:"An LSTM (Long Short-Term Memory) is a recurrent unit designed specifically to carry information across many time steps without it vanishing — the thing a plain RNN cannot do. Its central feature is a <b>cell state</b> c that runs along the sequence like a conveyor belt, altered only by a few simple, gated operations. Three <b>gates</b>, each a sigmoid producing values in (0, 1), control it: the <b>forget gate</b> f decides how much of the previous cell state to retain, the <b>input gate</b> i decides how much new information to write, and the <b>output gate</b> o decides how much of the cell to expose as the hidden state. A separate <b>candidate</b> g̃ = tanh(·), with values in (−1, 1), proposes the new content that might be written.<br><br>The two updates are: the cell state c_t = f ⊙ c_{t−1} + i ⊙ g̃, and the hidden state h_t = o ⊙ tanh(c_t) (⊙ is element-wise multiplication). The reason this beats a vanilla RNN on long-range dependencies lies in that cell update: it is mostly <i>additive</i> — the old cell state is carried forward and a new term is added rather than being fully overwritten by a squashing non-linearity. So during backprop the gradient can flow back along the cell path largely unimpeded; when the forget gate stays near 1 the gradient is neither repeatedly multiplied by small weight matrices nor crushed by a saturating activation, so it does not vanish across long spans. Once you have the four gate equations, filling them for one numeric step is purely mechanical."},
"t5-tanh":{
  test:"A one-line identity — tanh's derivative and its range — plus how it compares with sigmoid for the vanishing-gradient story.",
  idea:"tanh is a sigmoidal activation that maps any input into the range (−1, 1). Unlike the logistic sigmoid, it is <b>zero-centred</b>, which tends to make optimisation a little easier because the activations feeding the next layer aren't all pushed positive. This question is essentially a one-line identity plus its consequences. The derivative is tanh'(x) = 1 − tanh²(x). Since tanh(x) lies in (−1, 1), tanh²(x) lies in [0, 1), so the derivative lies in (0, 1], reaching its maximum of 1 at x = 0 and shrinking toward 0 as |x| grows and the function saturates.<br><br>The comparison worth carrying: tanh's derivative peaks at 1, versus sigmoid's peak of only 0.25, so tanh loses less gradient magnitude per layer and therefore vanishes <i>less</i> badly than sigmoid. But that peak of 1 is reached only at x = 0; away from the origin the derivative is still below 1, so multiplying many of them together across a deep network still drives the gradient toward zero. In short, tanh mitigates the vanishing-gradient problem but does not solve it — which is exactly the point the exam's comparison is fishing for."},
"t5-gd":{
  test:"Whether you can state the trade-off between batch and minibatch gradient descent across a few clear axes.",
  idea:"Gradient descent trains a network by repeatedly stepping the weights in the direction of the negative gradient of the loss; the variants differ in how much data is used to estimate that gradient at each step. <b>Batch (full) gradient descent</b> uses the entire training set for every update. This yields the <i>exact</i> gradient and a smooth, deterministic path toward a minimum, but each step is computationally expensive and memory-heavy, updates are infrequent, and with no randomness the optimiser can stall at saddle points or poor flat regions. <b>Minibatch gradient descent</b> uses a small random subset of examples per step (stochastic gradient descent, SGD, is the extreme case of batch size 1). The gradient is now a <i>noisy</i> estimate, but you get many more, far cheaper updates per pass over the data, the computation fits comfortably in memory, and — a genuine feature rather than just a cost — the noise helps the optimiser escape saddle points and sharp poor minima and tends to settle in flatter minima that generalise better.<br><br>The exam wants the trade-off laid out along a few clear axes: gradient accuracy (exact vs noisy), cost and frequency of updates (few expensive vs many cheap), memory demand (heavy vs light), and convergence behaviour (smooth but stall-prone vs noisy but better at exploring). Stating those contrasts, plus the point that the noise is beneficial, is the full answer."}
};

function isDone(k){return !!DONE[k]}
function setDone(k,v){DONE[k]=v;save("dlam.done",DONE)}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function blockById(id){return RM.blocks.find(b=>b.id===id)}
function built(id){return !!blockById(id)}

/* =========================== ROUTER =========================== */
function parseHash(){const h=location.hash.replace(/^#/,'')||'register';return h.split('/');}
function go(h){location.hash=h}
window.addEventListener('hashchange',render);

/* =========================== RAIL =========================== */
function renderRail(){
 const [view,arg]=parseHash();
 let h=`<div class="brand">DLAM<small>exam roadmap · ${BUILD}</small></div>`;
 h+=`<div class="railgrp"><h4>Views</h4>`;
 h+=railBtn('register','Register (home)',view==='register');
 h+=railBtn('cheat','★ Cheat sheet',view==='cheat');
 h+=railBtn('coverage','Coverage (per exam)',view==='coverage');
 h+=railBtn('worked','Worked appendix (Bank A)',view==='worked');
 h+=railBtn('craft','Exam craft',view==='craft');
 h+=railBtn('triage','Triage',view==='triage');
 h+=railBtn('anki','Anki decks',view==='anki');
 h+=railBtn('tracker','Tracker',view==='tracker');
 h+=`</div>`;
 for(let t=1;t<=6;t++){
   const rows=REGISTER.filter(r=>r.tier===t);
   if(!rows.length)continue;
   h+=`<div class="railgrp"><h4>Tier ${t}</h4>`;
   rows.forEach(r=>{
     const on = view==='block'&&arg===r.blockId;
     const pend = !built(r.blockId);
     h+=`<button class="rbtn ${on?'on':''} ${pend?'pending':''}" onclick="go('block/${r.blockId}')">
       <span>${esc(r.type.length>40?r.type.slice(0,38)+'…':r.type)}</span>
       <span class="pt">${r.bank}</span></button>`;
   });
   h+=`</div>`;
 }
 document.getElementById('rail').innerHTML=h;
}
function railBtn(hash,label,on){return `<button class="rbtn ${on?'on':''}" onclick="go('${hash}')">${label}</button>`;}

/* =========================== VIEWS =========================== */
function renderRegister(){
 let built_n=RM.blocks.length, total=REGISTER.length;
 let h=`<h1>Question register</h1>
   <p class="sub">${total} distinct types across 6 sittings · spine = DLAM_progress_tracker.md · ${built_n}/${total} blocks built (${BUILD}).</p>
   <div class="note acc"><div class="h">How to use this page</div>Study in tier order. Tier 1 alone is the biggest single point block; Tier 1–4 is a solid 1.7–2.0. Bank A = procedural (drill by re-solving, no Anki). Bank B = theory (Anki deck per block). Pending rows arrive in later build passes.</div>`;
 for(let t=1;t<=6;t++){
   const rows=REGISTER.filter(r=>r.tier===t);if(!rows.length)continue;
   const appears={1:'6/6',2:'5/6',3:'4/6',4:'3/6',5:'2/6',6:'1/6'}[t];
   h+=`<h2><span class="pill t${t}">TIER ${t}</span> &nbsp;appears ${appears}</h2>`;
   rows.forEach(r=>{
     const b=built(r.blockId);
     h+=`<div class="regrow">
       <span class="pill t${t}">${r.bank}</span>
       <span>${b?`<a href="#block/${r.blockId}">${esc(r.type)}</a>`:esc(r.type)}</span>
       <span class="ex">${esc(r.exams)}</span>
       <span class="ptc mono" style="text-align:right;color:${b?'var(--good)':'var(--warn)'}">${b?'built':'pending'}</span>
     </div>`;
   });
 }
 return h;
}

function renderBlock(id){
 const b=blockById(id);
 if(!b){const r=REGISTER.find(x=>x.blockId===id);
   return `<h1>${r?esc(r.type):'Unknown block'}</h1>
     <div class="note warn"><div class="h">Not built yet</div>This block is scheduled for a later pass (${r?('Tier '+r.tier):''}). The register lists it so coverage is visible; the teaching content arrives when its pass runs.</div>
     <div class="note acc"><div class="h">Cheat-sheet reminder</div>Once you reach here and build this block, go to the <a href="#cheat">Cheat sheet</a> and add its key formulas, then tick it off the pending list — the sheet is not complete until every pending block's formulas are on it.</div>
     <p><a href="#register">← back to register</a></p>`;}
 const done=isDone('block:'+b.id);
 let h=`<h1>${esc(b.title)}</h1>
   <p class="sub"><span class="pill t${b.tier}">TIER ${b.tier}</span> <span class="tag ${b.bank==='A'?'a':'b'}">Bank ${b.bank} · ${b.bank==='A'?'procedural':'theory'}</span> ${esc(b.points)}</p>
   <p class="sub mono">${esc(b.exams)}</p>`;
 if(b.primer){h+=`<div class="primer"><div class="ph">Start here — orientation</div>`+
   `<div class="pp"><span class="pl">What they're testing</span><span class="pb">${b.primer.test}</span></div>`+
   `<div class="pp"><span class="pl">The idea</span><span class="pb">${b.primer.idea}</span></div></div>`;}
 h+=`<div class="lede">${b.lede}</div>
   <div class="why"><b>Why this tier:</b> ${b.why}</div>`;
 (b.sections||[]).forEach(s=>{
   h+=`<div class="sec">${s.src?`<span class="src">${esc(s.src)}</span>`:''}<h3>${esc(s.h)}</h3>${s.body}`;
   if(s.note)h+=`<div class="note ${s.note.c}"><div class="h">${esc(s.note.h)}</div>${s.note.b}</div>`;
   h+=`</div>`;
 });
 (b.worked||[]).forEach((w,wi)=>{
   h+=`<div class="worked"><h3>${esc(w.h)}</h3><div class="q">${w.q}</div>`;
   if(w.pre)h+=`<pre style="font-family:var(--mono);font-size:11.5px;overflow:auto;background:var(--code-bg);color:var(--code-fg);padding:10px;border-radius:6px">${esc(w.pre)}</pre>`;
   if(w.intro)h+=`<p>${w.intro}</p>`;
   if(w.fwd){h+=`<p class="stepsub">Forward pass (recompute first — you'll need every value):</p><table class="gradtab"><tr>${w.fwd.map(a=>`<th>${esc(a[0])}</th>`).join('')}</tr><tr>${w.fwd.map(a=>`<td>${esc(a[1])}</td>`).join('')}</tr></table>`;}
   if(w.steps&&w.steps.length)h+=`<p class="stepsub">Backward pass — every step, in the order you write it:</p>`;
   (w.steps||[]).forEach(st=>{h+=`<div class="step"><b>${esc(st[0])}</b><div>${st[1]}</div></div>`;});
   if(w.answer){h+=`<p class="stepsub">Final gradients:</p><table class="gradtab"><tr><th>pos</th>${w.answer.map(a=>`<td>${esc(a[0])}</td>`).join('')}</tr><tr><th>grad</th>${w.answer.map(a=>`<td>${esc(a[1])}</td>`).join('')}</tr></table><p class="sub">* given in the question.</p>`;}
   if(w.examwrite)h+=`<div class="examwrite"><div class="h">What you actually write on the exam sheet</div>${w.examwrite}</div>`;
   h+=`</div>`;
 });
 if(b.variations&&b.variations.length){
   h+=`<h2>Every real variation of this type</h2><table><tr><th>Exam</th><th>What's different</th></tr>`;
   b.variations.forEach(v=>{h+=`<tr><td class="mono">${esc(v.ex)}</td><td>${v.d}</td></tr>`;});
   h+=`</table>`;
 }
 if(b.drill)h+=`<div class="drill"><div class="h">Drill (do this solo)</div>${b.drill}</div>`;
 if(b.anki&&(b.anki.basic.length||b.anki.cloze.length)){
   h+=`<h2>Anki (theory) — <a href="#anki">all decks →</a></h2>${ankiBlocks(b)}`;
 }
 if(b.checks){
   h+=`<h2>Done when</h2><ul class="checks">`;
   b.checks.forEach((c,i)=>{const k='chk:'+b.id+':'+i,d=isDone(k);
     h+=`<li class="${d?'done':''}" onclick="toggle('${k}')"><input type="checkbox" ${d?'checked':''} onclick="event.stopPropagation();toggle('${k}')"><span>${c}</span></li>`;});
   h+=`</ul>`;
 }
 h+=`<hr class="hr"><label style="cursor:pointer"><input type="checkbox" ${done?'checked':''} onclick="toggle('block:${b.id}')"> Mark whole block learned</label>`;
 return h;
}

function ankiBlocks(b){
 let out='';
 if(b.anki.basic.length){
   const tsv=b.anki.basic.map(r=>r.join('\t')).join('\n');
   out+=ankiPre('Basic — Front⇥Back⇥Tag',tsv);
 }
 if(b.anki.cloze.length){
   const tsv=b.anki.cloze.map(r=>r.join('\t')).join('\n');
   out+=ankiPre('Cloze — Text⇥Extra⇥Tag',tsv);
 }
 return out;
}
let PREN=0;
function ankiPre(label,tsv){
 const id='pre'+(PREN++);
 return `<div class="anki"><div class="hd"><span>${esc(label)}</span><button class="copy" onclick="copyPre('${id}')">copy</button></div><pre id="${id}">${esc(tsv)}</pre></div>`;
}
function copyPre(id){const t=document.getElementById(id).textContent;navigator.clipboard&&navigator.clipboard.writeText(t);}

 <div class="note acc"><div class="h">Time = marks</div>90 marks in 90 minutes ⇒ <b>1 minute per mark</b>, including reading. A 5-mark question gets ~5 min; do not overrun a theory question and starve a backprop block.</div>
 <h2>Point value = sentence count</h2>
 <p>A 1-mark question wants one sentence. A 5–6 marker wants that many crisp points, usually structured. Two classic ways students bleed marks: writing a paragraph where a line was asked, and <b>giving a definition without an example</b> — most definition questions want both.</p>
 <h2>Cheat sheet — use ALL the space</h2>
 <div class="note good"><div class="h">Survivor advice (highest-signal)</div>Past students agree the single biggest lever is that <b>most people underuse the cheat sheet</b>. Fill both sides. Put on it exactly what is expensive to recall under time pressure; know cold what is cheap.</div>
 <table><tr><th>Put on the sheet</th><th>Know cold (don't waste sheet space)</th></tr>
 <tr><td>Output-size <code>N_out=⌊(N+2P−F)/S⌋+1</code>; sigmoid & Leaky-ReLU formula+deriv+range (α=0.04 for 2024/SoSe25); attention <code>softmax(QKᵀ/√d_k)V</code>; LSTM gate formulas; BatchNorm formula; ELBO skeleton; SiLU = x·σ(x)</td>

function renderTriage(){
 const gates=[
  {c:"You hesitate on any +/×/max gate rule",r:"Stop. Re-drill T1 gate rules until reflex before anything else — it's 12–18 marks and it's binary.",link:"block/t1-backprop"},
  {c:"You forget to sum gradients at a branch / skip connection",r:"This is the most-missed backprop step. Re-do SS21 Q3 focusing on pos 2 (the branch). Same idea powers the ResNet advantage.",link:"block/t1-backprop"},
  {c:"You can draw a ResNet block but not say why the skip helps",r:"Tie it to the add-gate pass-through: derivative-1 path back to early layers. That sentence is the mark.",link:"block/t2-resnet"},
  {c:"You blank on the max-pool sub-question",r:"Answer is fixed: NO — max-pool routes the gradient (×1 to the max), it doesn't shrink it.",link:"block/t2-vanish"},
  {c:"You describe GANs but not the generation-time components",r:"At inference: only noise→G→image. D and data are training-only. That contrast is the sub-part's mark.",link:"block/t2-gan"}

/* ---- CHEAT SHEET (curated, dense — mirrors the DMML two-side format) ----
   Side 1 = Bank A numerical procedures; Side 2 = Bank B theory.
   PENDING list must shrink to empty as Pass 5/6 blocks are built. */
const CHEAT = {
 side1:[
  {c:"T1", t:"BACKPROP — fill gradients", w:"12–18p · 6/6", b:`<b>grad flows R→L: grad_in × local_deriv → input; SUM at branches.</b> Gate locals: ADD →×1 to each input. MUL z=xy → x gets grad·y, y gets grad·x (the OTHER). MAX/ReLU → full grad to arg-max input, 0 to losers (ReLU=max(0,x): pass if x>0 else 0). σ → σ(1−σ) (use fwd σ). exp → its own output. 1/x → −1/x². −x → −1. +c → ×1. ½(g−y)² → dL/dg=(g−y). <b>Steps:</b> 1 fwd, record every value; 2 grad=1 at out; 3 walk L; 4 SUM at fan-out/skip. <b>Checks:</b> branch/skip = ADD the two grads (most-missed). g<y* ⇒ params ↑.`},
  {c:"T4", t:"BUILD comp-graph act(w·x+b)", w:"8p", b:`Skeleton always: one <code>×</code> per wᵢxᵢ → <code>+</code>-tree to sum → <code>+</code>bias → activation as PRIMITIVE gates. Leaky max(0,αx): ×α then max-0. σ wrapper: −(·)→exp→+1→1/(·). Marks per node/edge. Lose by: activation as black box, or missing bias node. Label every wire.`},
  {c:"T3", t:"CONV — apply / recover kernel", w:"3–5p · 4/6", b:`Out cell = Σ(kernel ⊙ patch), same-position products, slide by stride, <b>no flip</b>. FORWARD: full kernel → fill map. INVERSE: out given + blank kernel cells → each known out-cell = 1 linear eqn in unknowns → solve. (Prof reuses SS21 5×5 input+kernel, hides a row in 2024.)`},
  {c:"T3", t:"POOLING — size + apply", w:"2–4p · 4/6", b:`Size (shared w/ conv): <code>N_out=⌊(N−F+2P)/S⌋+1</code>, rows & cols separately, round DOWN. 2×2 stride 2 = non-overlapping blocks. AVG=mean of 4; MAX=largest. Pooling has 0 params.`},
  {c:"T5", t:"PARAM COUNT", w:"3p", b:`Conv <code>(F·F·C_in+1)·C_out</code> · Pool <code>0</code> · FC <code>(n_in+1)·n_out</code>. <b>+1 = bias</b> (per filter / per unit) — most-dropped mark. Conv count independent of map size. RGB ⇒ C_in=3. Don't forget the output layer.`},
  {c:"T3", t:"SPN — EVI / MAR / MAP", w:"4p · 4/6", b:`Bottom-up: ×-node = product of children; +-node = weighted sum; root = answer. Leaf = 1 if consistent, 0 if not, <b>1 if var summed-out</b>. EVI = full assignment. MAR = summed-out var's leaves all 1. MAP = eval per target value → argmax. Show intermediate node values.`},
  {c:"T3", t:"ATTENTION — formula + apply", w:"4–6p · 4/6", b:`<code>Attn(Q,K,V)=softmax(QKᵀ/√dₖ)·V</code>. 1 score=q·kⱼ (dot). 2 ÷√dₖ. 3 row-softmax (weights sum 1). 4 out=Σ wⱼvⱼ. Why √dₖ: big dₖ → big dots → softmax saturates → grad vanishes; scaling keeps it smooth.`},
  {c:"T5", t:"SiLU + BN backprop", w:"—", b:`Same T1 walk + 2 locals. SiLU=x·σ(x), deriv=σ(x)+x·σ(x)(1−σ(x)). BN node=γx̂+β, x̂=(x−μ)/√(σ²+ε); given batch stats, local wrt input = <code>γ/√(σ²+ε)</code>.`},
  {c:"T5", t:"MAX-GATE", w:"—", b:`Forward = max. Backward = full grad to arg-max input, 0 to rest (switch, no scaling). Same rule powers max-pool & ReLU.`},
  {c:"T5", t:"LSTM — fill gates", w:"—", b:`f,i,o = σ(·)∈(0,1) gates; g̃=tanh(·)∈(−1,1) candidate. <code>c_t=f⊙c_{t−1}+i⊙g̃</code>; <code>h_t=o⊙tanh(c_t)</code>. Long-range: cell update is ADDITIVE ⇒ grad highway (forget≈1 ⇒ no vanish).`},
  {c:"ACT", t:"Activation derivs (lookup)", w:"7p", b:`σ=1/(1+e⁻ˣ), σ'=σ(1−σ), range (0,1), σ'≤0.25. LeakyReLU: x if x≥0 else αx; f'=1 (x>0)/α (x<0). <b>α=0.04 (2024/SoSe25), ε=0.01 (WiSe25/26) — cite per paper.</b> tanh∈(−1,1), tanh'=1−tanh², range (0,1], max 1 @0.`}
 ],
 side2:[
  {c:"T2", t:"RESNET", w:"4–6p · 5/6", b:`Block <code>out=F(x)+x</code>; skip edge adds input back → learns residual. Why: (1) +x add-gate passes grad ×1 → direct route to early layers → deep nets trainable; (2) identity easy (F→0) → depth never hurts. Draw 3-node graph (F, skip, +). Tie every advantage to the skip/gradient path.`},
  {c:"T2", t:"VANISHING vs DYING (+max-pool)", w:"4–6p · 4/6", b:`Vanishing: grads = product of layer locals; if <1 (σ'≤0.25, tanh flat) → shrinks exp with depth → early layers stall (saturation). Dying ReLU: input always <0 → out 0, grad 0 forever → dead; LeakyReLU (α>0) fixes. <b>Max-pool cause vanishing? NO</b> — routes grad ×1 to max, no factor <1.`},
  {c:"T2", t:"GAN", w:"4–6p · 4/6", b:`G: noise z→fake. D: sample→P(real). Minimax: D separates real/fake, G fools D; equilibrium fakes≈real, D≈50%. Train: z→G→fake; real+fake→D→real/fake. <b>Generation (inference): ONLY z→G→image; discard D + training set</b> ← the sub-part mark.`},
  {c:"T3", t:"RNN→TRANSFORMER + O(·)", w:"3–4p · 4/6", b:`2 RNN problems fixed: (1) sequential → no parallelism; (2) long-range deps vanish over many steps. Transformer self-attention: every pos sees every pos in 1 layer → parallel + direct long-range. Per layer: self-attn <code>O(n²·d)</code>, RNN <code>O(n·d²)</code>.`},
  {c:"T3", t:"ETHICS of LLMs", w:"~5p · 4/6", b:`Name 3–4 DISTINCT, 1 line each: bias/toxicity (amplifies data); misinfo/hallucination (fluent-but-false, disinfo); privacy (memorise/leak); env & compute cost + power concentration; misuse/accountability (fraud, unclear responsibility). Breadth > depth; checklist not essay.`},
  {c:"T4", t:"BATCHNORM", w:"4–5p", b:`Def <code>hᵢ=gᵢ·(aᵢ−μᵢ)/σᵢ+bᵢ</code>: standardise over mini-batch (μ,σ), then <b>learned scale g + shift b</b> (don't drop them). Adv+mechanism: stable activation distribution → faster/stable training, higher LR, less init-sensitive, mild regularisation.`},
  {c:"T4", t:"BIAS–VARIANCE (hidden units)", w:"3p", b:`Fewer units → simpler → bias↑ variance↓ (underfit). More → bias↓ variance↑ (overfit). Feature extractor (SoSe25 Q4b): hidden layers learn representation, final layer = simple classifier on it.`},
  {c:"T5", t:"BATCH vs MINIBATCH GD", w:"—", b:`Batch: whole set, exact grad, smooth, slow/costly, memory-heavy, can stall at saddles. Minibatch (SGD=1): random subset, noisy grad, many cheap steps, fits memory, noise escapes saddles/sharp minima → generalises better. Axes: accuracy / cost&freq / memory / convergence.`}
 ],
 pending:`<b>Not yet on this sheet — build the block, then add its formulas here and tick it off:</b><br>
  Tier-5 Bank B: optimizers (Newton/AdaGrad/RMSprop directions), grid vs random search, weight-init (flat-loss suspect), bidirectional RNN, autoencoder, <b>VAE (explicit vs implicit vs GAN)</b>, <b>reparameterization trick + ELBO skeleton</b>. &nbsp; Tier-6: sigmoid-neuron df/dw (+L2), overfitting/early-stopping, dropout≈bagging, LR curves. <br>
  <b>The sheet is NOT complete until every item above is on it.</b> When you reach any of these blocks (or land back on this page), come here and fold its formulas in.`
};

 q:{
  SS21:{1:5,2:4,3:12,4:8,5:6,6:12,7:2,8:2,9:6,10:7,11:5,12:5,13:5,14:6,15:2,16:5},
  '2024':{1:7,3:13,6:4,8:8,10:10},
  SoSe25:{1:6,2:2,3:7,4:6,5:18,6:12,7:7,8:8,9:4,10:12,11:7,12:11},
  'WiSe25/26':{1:6,2:2,3:7,8:8,10:12,11:7},
  MT22:{}, MT23:{}
 }
};
function ptsMid(p){ if(!p||p==='—')return null; const m=(''+p).match(/(\d+)\s*[–-]\s*(\d+)/); if(m)return ((+m[1])+(+m[2]))/2; const s=(''+p).match(/\d+/); return s?+s[0]:null; }
function renderCoverage(){
 const SITTINGS=["SS21","MT22","MT23","2024","SoSe25","WiSe25/26"];
 const map={}; SITTINGS.forEach(s=>map[s]=[]);
 REGISTER.forEach(r=>{
   (r.exams||'').split('·').forEach(tok=>{
     tok=tok.trim(); if(!tok)return;
     let labels=null,q=null;
     if(tok.indexOf('MT22/23')===0){ labels=['MT22','MT23']; q=tok.slice(7).trim(); }
     else if(tok.indexOf('WiSe25/26')===0){ labels=['WiSe25/26']; q=tok.slice(9).trim(); }
     else { const m=tok.match(/^(SS21|MT22|MT23|2024|SoSe25)\s+(.*)$/); if(m){ labels=[m[1]]; q=m[2].trim(); } }
     if(!labels)return;
     labels.forEach(L=>{ if(map[L]) map[L].push({q,type:r.type,blockId:r.blockId,tier:r.tier,bank:r.bank,pts:r.pts,built:built(r.blockId)}); });
   });
 });
 const qnum=q=>{const m=(q||'').match(/\d+/);return m?parseInt(m[0],10):99;};
 let h=`<h1>Coverage — every real paper, question by question</h1>
   <p class="sub">Each sitting's questions, inverted from the register and linked to the block that teaches it, with verified marks from the actual paper. "Built" = solvable now; "pending" = arrives in a later pass. Use this to confirm a whole paper before a timed run.</p>
   <div class="note acc"><div class="h">What this proves</div>The 31-type register is the exhaustive taxonomy of what this professor asks. If every question below is <b>built</b> and learned, you can solve every real past paper. The marks column is exact where read from the paper; SS21 &amp; SoSe25 are fully verified (they sum to the stated total), so their "solvable marks" number is real.</div>`;
 SITTINGS.forEach(S=>{
   const rows=map[S].slice().sort((a,b)=>qnum(a.q)-qnum(b.q));
   if(!rows.length)return;
   const n=rows.length, done=rows.filter(x=>x.built).length, pct=Math.round(100*done/n);
   // solvable marks (unique exam-question, all its rows built, exact mark known)
   const groups={};
   rows.forEach(x=>{const k=qnum(x.q); (groups[k]=groups[k]||{built:true}); if(!x.built)groups[k].built=false;});
   let solvable=0; Object.keys(groups).forEach(k=>{ const mk=(MARKS.q[S]||{})[k]; if(groups[k].built&&mk!=null)solvable+=mk; });
   const tot=MARKS.total[S];
   let head=`${done}/${n} question-types built (${pct}%)`;
   if(tot!=null && MARKS.complete[S]) head+=` &nbsp;·&nbsp; <b>solvable now ≈ ${solvable}/${tot} marks</b>`;
   else if(tot!=null) head+=` &nbsp;·&nbsp; total ${tot} marks (some marks unverified)`;
   else head+=` &nbsp;·&nbsp; marks not stated in source protocol`;
   h+=`<h2>${esc(S)} <span class="sub">— ${head}</span></h2>
     <div class="progress"><i style="width:${pct}%"></i></div>`;
   rows.forEach(x=>{
     const ex=(MARKS.q[S]||{})[qnum(x.q)];
     const est=ptsMid(x.pts);
     const mcell = ex!=null ? `${ex}p` : (est!=null?`~${est}p`:'—');
     const mclass = ex!=null ? '' : 'est';
     h+=`<div class="covrow">
       <span class="cq">${esc(x.q)}</span>
       <span>${x.built?`<a href="#block/${x.blockId}">${esc(x.type)}</a>`:esc(x.type)}</span>
       <span class="sub">T${x.tier} · ${x.bank}</span>
       <span class="cm ${mclass}">${mcell}</span>
       <span class="cs" style="color:${x.built?'var(--good)':'var(--warn)'}">${x.built?'built':'pending'}</span>
     </div>`;
   });
 });
 h+=`<p class="sub" style="margin-top:16px">Marks: <b>Np</b> = read exactly from that paper; <b>~Np</b> = register type-range estimate (grey), not read from that specific paper; <b>—</b> = source states no marks. <b>SS21</b> (92p) and <b>SoSe25</b> (100p) reconstruct exactly to their stated totals — their solvable-marks readouts are real. <b>2024</b> &amp; <b>WiSe25/26</b> are HedgeDoc protocols that annotate only some questions, so a few marks are estimates. <b>MT22/23</b> are solution-only protocols with no point annotations. Mapping is by recurring question type (the register taxonomy).</p>`;
 return h;
}

function renderTracker(){
 let h=`<h1>Tracker</h1>`;
 const tiers=[1,2,3,4,5,6];
 h+=`<div class="topbar"><span class="grow sub">Progress persists in this browser (localStorage).</span>
   <button class="btn" onclick="expJSON()">export JSON</button>
   <button class="btn" onclick="document.getElementById('imp').click()">import JSON</button>
   <input id="imp" type="file" accept="application/json" style="display:none" onchange="impJSON(event)">
   <button class="btn" onclick="toggleTheme()">theme</button></div>`;
 tiers.forEach(t=>{
   const rows=REGISTER.filter(r=>r.tier===t);if(!rows.length)return;
   const bl=rows.filter(r=>built(r.blockId));
   const doneN=bl.filter(r=>isDone('block:'+r.blockId)).length;
   const pct=bl.length?Math.round(100*doneN/bl.length):0;
   h+=`<h3><span class="pill t${t}">TIER ${t}</span> ${doneN}/${bl.length} built-blocks learned <span class="sub">(${rows.length-bl.length} pending build)</span></h3>
     <div class="progress"><i style="width:${pct}%"></i></div>`;
   rows.forEach(r=>{
     const b=built(r.blockId), d=isDone('block:'+r.blockId);
     h+=`<div class="regrow"><span class="pill t${t}">${r.bank}</span>
       <span>${b?`<a href="#block/${r.blockId}">${esc(r.type)}</a>`:esc(r.type)}</span>
       <span class="ex">${esc(r.exams)}</span>
       <span class="ptc mono" style="text-align:right;color:${!b?'var(--warn)':(d?'var(--good)':'var(--mut)')}">${!b?'pending':(d?'learned':'built')}</span></div>`;
   });
 });
 return h;
}

/* =========================== ACTIONS =========================== */
function toggle(k){setDone(k,!isDone(k));render();}
function expJSON(){const blob=new Blob([JSON.stringify({done:DONE,build:BUILD},null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='dlam_progress.json';a.click();}
function impJSON(ev){const f=ev.target.files[0];if(!f)return;const rd=new FileReader();
 rd.onload=()=>{try{const o=JSON.parse(rd.result);if(o.done){DONE=o.done;save('dlam.done',DONE);render();}}catch(e){alert('bad JSON')}};
 rd.readAsText(f);ev.target.value='';}
function initTheme(){const t=load('dlam.theme','dark');if(t==='light')document.documentElement.setAttribute('data-theme','light');}
function toggleTheme(){const cur=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';
 if(cur==='light')document.documentElement.setAttribute('data-theme','light');else document.documentElement.removeAttribute('data-theme');
 save('dlam.theme',cur);}

/* =========================== RENDER =========================== */
function render(){
 renderRail();
 const [view,arg]=parseHash();
 let h='';
 if(view==='register')h=renderRegister();
 else if(view==='cheat')h=renderCheat();
 else if(view==='coverage')h=renderCoverage();
 else if(view==='block')h=renderBlock(arg);
 else if(view==='worked')h=renderWorked();
 else if(view==='craft')h=renderCraft();
 else if(view==='triage')h=renderTriage();
 else if(view==='anki')h=renderAnki();
 else if(view==='tracker')h=renderTracker();
 else h=renderRegister();
 const main=document.getElementById('main');
 main.innerHTML=h;main.scrollTop=0;
 if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([main]);
}
initTheme();
render();
console.log('%cDLAM roadmap '+BUILD+' — blocks:'+RM.blocks.length+'/'+REGISTER.length,'color:#6aa9ff');
</script>
